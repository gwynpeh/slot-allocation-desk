/* Additional loading decisions. Each one leaves a notice for the requesting agent. */
function notify(r,kind,extra,reason){
  const d=new Date();
  S.notices.push({id:uid(),b:r.b,port:r.port,kind,ref:r.ref,pod:r.pod,fpd:r.fpd,teu:r.teu,mt:r.mt,extra:extra||null,reason:reason||'',read:false,
    at:fmt(TODAY)+' '+d.toTimeString().slice(0,5)});
}
function approveReq(r){                                         // returns an error message, or '' when approved
  const b=r.b, need=vpos(vsub(vadd(used(b,r.port,r.pod),pick(r)),eff(b,r.port,r.pod))), room=legRoom(b,r.port,r.pod);
  const tight=DIMS.find(x=>need[x.k]>room[x.k]);
  if(tight) return `${r.ref}: vessel only has ${n0(Math.max(0,room[tight.k]))} ${tight.u} spare between ${sn(loadCall(b,r.port))} and ${sn(r.pod)}.`;
  if(r.rf){ const a=rfA(b,r.port), avail=a!==undefined?a-rfUsed(b,r.port):rfRoom(b,r.port,r.pod);
    if(r.rf>avail) return `${r.ref}: not enough reefer plugs for ${nm(r.port)}. Raise its reefer BSA first.`; }
  S.extra=S.extra||[]; S.extra.push({id:uid(),b,port:r.port,pod:r.pod,...need,ref:r.ref});   // revises allocation, original stays untouched
  S.bookings.push({id:uid(),b,ref:r.ref,port:r.port,pod:r.pod,fpd:r.fpd,teu:r.teu,mt:r.mt,rf:r.rf||0,rfTeu:r.rfTeu||0});
  r.status='approved'; notify(r,'approved',need);
  addLog(`HQ approved additional loading for ${nm(r.port)}: ${n0(r.teu)} TEU / ${n0(r.mt)} MT to ${sn(r.pod)} (${r.ref}). Revised allocation +${n0(need.teu)} TEU / ${n0(need.mt)} MT.`);
  return '';
}
function rejectReq(r){ r.status='rejected'; notify(r,'rejected'); addLog(`HQ rejected additional loading for ${nm(r.port)} (${r.ref}).`); }

// Approve amount A (raise of revised allocation) for one POL→POD. Requests there are booked in order up to the new limit.
function decidePod(b,p,d,A,reason){
  const list=reqs(b,p,'pending').filter(r=>r.pod===d);
  if(vany(A)){
    const room=legRoom(b,p,d), tight=DIMS.find(x=>A[x.k]>room[x.k]);
    if(tight) return {err:`Vessel only has ${n0(Math.max(0,room[tight.k]))} ${tight.u} spare between ${sn(loadCall(b,p))} and ${sn(d)}.`};
    S.extra.push({id:uid(),b,port:p,pod:d,...A,ref:list.map(r=>r.ref).join(', ')});
  }
  let left=vpos(bookLeft(b,p,d)), res={full:0,part:0,rej:0}, first=true;
  list.forEach(r=>{
    const per=r.teu?r.mt/r.teu:0;
    let t=Math.min(r.teu, left.teu, per?Math.floor(left.mt/per):r.teu);
    let rf=r.rf?Math.min(r.rf,Math.round(r.rf*t/Math.max(1,r.teu))):0;
    if(rf){ const a=rfA(b,p), avail=a!==undefined?a-rfUsed(b,p):rfRoom(b,p,d); if(rf>avail){ rf=Math.max(0,avail); } }
    const bk={teu:t, mt:t>=r.teu?r.mt:Math.round(t*per)};
    if(t>0){ S.bookings.push({id:uid(),b,ref:t>=r.teu?r.ref:r.ref+'-P',port:r.port,pod:d,fpd:r.fpd,...bk,
      ...(t>=r.teu?{e20:r.e20,e40:r.e40,ehc:r.ehc,dg:r.dg||0,dgc:r.dgc,oog:r.oog||0,lost:r.lost||0}:{dg:0,oog:0,lost:0}),rf,rfTeu:rf?Math.min(r.rfTeu||rf,Math.max(rf,Math.round((r.rfTeu||0)*t/r.teu))):0}); left=vpos(vsub(left,bk)); }
    r.booked=bk; r.status = t>=r.teu?'approved':t>0?'partial':'rejected';
    notify(r, r.status, {granted:first?A:null, booked:bk}, reason); first=false;
    res[t>=r.teu?'full':t>0?'part':'rej']++;
  });
  addLog(vany(A)
    ? `HQ approved +${n0(A.teu)} TEU / ${n0(A.mt)} MT for ${nm(p)} → ${sn(d)}: ${res.full} in full, ${res.part} in part, ${res.rej} not loaded.`
    : `HQ rejected additional loading for ${nm(p)} → ${sn(d)} (${list.length} request${list.length===1?'':'s'}).` + (reason?` Reason: ${reason}.`:''));
  return {res};
}
// Release one POD's unused balance to the pool. The port stays open for its other PODs.
function releasePod(b,p,d,amt,reason){
  p=aKey(b,p);
  const max=vpos(vsub(eff(b,p,d),used(b,p,d)));
  const un=amt?Object.fromEntries(DIMS.map(x=>[x.k,Math.min(max[x.k],Math.max(0,amt[x.k]||0))])):max;
  if(!vany(un)){ armed=null; return toast('Enter how much to release',true); }
  S.released[K(b,p,d)]=vadd(rel(b,p,d),un); armed=null;
  addLog(`${nm(p)} released ${n0(un.teu)} TEU / ${n0(un.mt)} MT to ${sn(d)} into the balance pool${role==='HQ'?' (by HQ)':''}${reason?`. Reason: ${reason}`:''}.`);
  toast(`Released ${n0(un.teu)} TEU / ${n0(un.mt)} MT to ${sn(d)} from ${nm(p)}`);
}

      : `<span class="chip over">Rejected</span> <b>${esc(n.ref)}</b> ${n0(n.teu)} TEU / ${n0(n.mt)} MT to ${sn(n.pod)} (${BD(n.b).label.toLowerCase()}) will not load on this vessel. Roll it to a later vessel.`}${n.reason?` <span class="muted">Reason: ${esc(n.reason)}.</span>`:''} <span class="muted">${esc(n.at)}</span></li>`; }).join('')}</ul></div>
    <button type="button" class="primary" data-ack="${role}">Got it</button></div></section>`;
}

function release(p,reason){
  p=aKey(B,p);                                                   // a YRD port releases the shared allocation
  let tot=Z();
  BOUNDS[B].pods.forEach(d=>{ const un=vpos(vsub(eff(B,p,d),used(B,p,d))); if(vany(un)){ S.released[K(B,p,d)]=vadd(rel(B,p,d),un); tot=vadd(tot,un);} });
  let plugs=0; const a=rfA(B,p); if(a!==undefined){ plugs=Math.max(0,a-rfUsed(B,p)); S.rfAlloc[K(B,p)]=rfUsed(B,p); }
  S.closed[K(B,p)]=true; armed=null;
  addLog(`${nm(p)} released ${n0(tot.teu)} TEU / ${n0(tot.mt)} MT to the balance pool${plugs?` and ${plugs} reefer plugs to the vessel`:''}${role==='HQ'?' (by HQ)':''}${reason?`. Reason: ${reason}`:''}.`);
  toast(`Released ${n0(tot.teu)} TEU / ${n0(tot.mt)} MT${plugs?` and ${plugs} plugs`:''} from ${nm(p)}`);
}

/* ================= Reason codes ================= */
const REASONS = {
  release:['Weak demand','Customer cancellation','Cut-off rule','Equipment shortage','Schedule change','Other'],
  approve:['Key account','High yield','Space available on legs','Other'],
  reject:['Low yield','Vessel full on a leg','Special cargo limits','Allocation discipline','Other']
};
const reasonSel = (id,kind) => `<select id="${id}" class="rsn" aria-label="Reason">${REASONS[kind].map(r=>`<option>${r}</option>`).join('')}</select>`;
const decisionReasons = id => `<select id="${id}" class="rsn" aria-label="Reason"><optgroup label="If approving">${REASONS.approve.map(r=>`<option>${r}</option>`).join('')}</optgroup><optgroup label="If rejecting">${REASONS.reject.map(r=>`<option>${r}</option>`).join('')}</optgroup></select>`;
const rsnOf = id => document.getElementById(id)?.value || '';

/* ================= Release rules ================= */
// Staged release before cut-off. A stage fires once per port when today reaches (cut-off − days) and the port is under the threshold.
function rulesDue(){
  const R=ALL.rules; if(!R.on) return [];
  const out=[];
  origins(B).filter(p=>loadsIn(B,p)&&!closedP(B,p)).forEach(p=>{
    const co=addDays(E(lci(B,p)),-1), e=effP(B,p), u=usedP(B,p), util=e.teu?u.teu/e.teu:1, un=vpos(vsub(e,u));
    R.stages.forEach((s,i)=>{
      if(S.ruleRuns[K(B,p,i)] || TODAY<addDays(co,-s.days) || util>=s.under || !vany(un)) return;
      out.push({p,i,s,util,un,amt:Object.fromEntries(DIMS.map(x=>[x.k,Math.floor(un[x.k]*s.pct)]))});
    });
  });
  return out;
}
function applyRules(){
  const due=rulesDue(); let n=0;
  due.forEach(d=>{ if(S.ruleRuns[K(B,d.p,d.i)]) return;
    if(d.s.pct>=1){ release(d.p,'Cut-off rule'); R_markAll(d.p); }
    else BD(B).pods.forEach(pod=>{ const un=vpos(vsub(eff(B,d.p,pod),used(B,d.p,pod))); const a=Object.fromEntries(DIMS.map(x=>[x.k,Math.floor(un[x.k]*d.s.pct)])); if(vany(a)) releasePod(B,d.p,pod,a,'Cut-off rule',true); });
    S.ruleRuns[K(B,d.p,d.i)]=true; n++; });
  return n;
}
function R_markAll(p){ ALL.rules.stages.forEach((_,i)=>S.ruleRuns[K(B,aKey(B,p),i)]=true); }
function rulesPanel(){
  const R=ALL.rules, due=rulesDue();
  return `<section class="panel" data-nav="Release rules"><div class="ph"><div><h2>Release rules</h2>
    <p>Unused balance is released in stages before each port's cut-off, so later ports can use it in time. A stage applies once per port, only if the port is below the threshold. The last stage at cut-off releases everything left and closes the port.</p></div>
    <label class="chk" for="rl-on"><input type="checkbox" id="rl-on" ${R.on?'checked':''}> Rules on</label></div>
    <div class="tbl-wrap"><table><thead><tr><th>Stage</th><th class="num">Days before cut-off</th><th class="num">If booked below</th><th class="num">Release</th></tr></thead><tbody>${
      R.stages.map((s,i)=>`<tr><td><span class="pname">Stage ${i+1}${s.pct>=1?'<small>Closes the port</small>':''}</span></td>
        <td class="num"><input type="number" min="0" max="14" id="rs-days-${i}" data-stage="${i}|days" value="${s.days}"></td>
        <td class="num"><input type="number" min="0" max="100" id="rs-under-${i}" data-stage="${i}|under" value="${Math.round(s.under*100)}"> %</td>
        <td class="num"><input type="number" min="0" max="100" id="rs-pct-${i}" data-stage="${i}|pct" value="${Math.round(s.pct*100)}"> % of unused</td></tr>`).join('')
    }</tbody></table></div>
    <h3>Due now · ${fmt(TODAY)}</h3>
    ${due.length?`<div class="tbl-wrap"><table><thead><tr><th>Port of load</th><th class="num">Cut-off</th><th class="num">Booked</th><th>Stage</th><th class="num">Will release</th></tr></thead><tbody>${
      due.map(d=>`<tr><td><span class="pname">${nm(d.p)}</span></td><td class="num">${cutoff(E(lci(B,d.p)))}</td><td class="num">${pct(d.util)}</td><td>Stage ${d.i+1}${d.s.pct>=1?' · closes':''}</td><td class="num">${d.s.pct>=1?tot(d.un):tot(d.amt)}</td></tr>`).join('')
    }</tbody></table></div><div class="acts"><button type="button" class="primary" data-applyrules>Apply ${due.length} release${due.length===1?'':'s'}</button></div>`:'<p class="empty">Nothing due on this bound today.</p>'}
  </section>`;
}

/* ================= Schedule changes ================= */
const sch = () => S.sched;
const delayTo = i => Object.entries(S.sched.delay).reduce((s,[j,d])=>s+(+j<=i?d:0),0);
const omitted = i => !!S.sched.omit[i];
const nextVoyId = () => (VOYAGES[voyIdx()+1]||{}).id;
// Move allocation, bookings, waiting requests and forecasts that touch call i (or everything) to the next vessel.
function moveToNext(match){
  const nid=nextVoyId(); if(!nid) return {err:'There is no later vessel in this plan to move to.'};
  const N=ALL.voyages[nid]; let t=Z(), nb=0;
  S.bookings=S.bookings.filter(x=>{ if(!match(x.b,x.port,x.pod)) return true; N.bookings.push({...x,id:uid(),ref:x.ref+'-R'}); t=vadd(t,pick(x)); nb++; return false; });
  S.alloc=S.alloc.filter(a=>{ if(!match(a.b,a.port,a.pod)) return true; const m=N.alloc.find(y=>y.b===a.b&&y.port===a.port&&y.pod===a.pod); if(m){ m.teu+=a.teu; m.mt+=a.mt; } else N.alloc.push({...a}); return false; });
  S.requests.filter(r=>r.status==='pending'&&match(r.b,r.port,r.pod)).forEach(r=>{ r.status='rejected'; N.requests.push({...r,id:uid(),status:'pending'}); notify(r,'rejected',null,'Schedule change: moved to '+nid); });
  Object.keys(S.forecast).forEach(k=>{ const [b,p,d]=k.split('|'); if(match(b,p,d)){ N.forecast[k]=S.forecast[k]; delete S.forecast[k]; } });
  return {nb,t,to:nid};
}
const touches = i => (b,p,d) => lci(b,p)===i || ci(b,d)===i;
function schedPanel(){
  const nid=nextVoyId(), nv=nid?VOYAGES.find(v=>v.id===nid):null;
  const rows=ROT.slice(0,-1).map((c,i)=>{
    const aff=S.bookings.filter(x=>touches(i)(x.b,x.port,x.pod)), t=vsum(aff.map(pick)), om=omitted(i), moved=S.sched.moved[i];
    return `<tr class="${om?'self':''}"><td><span class="pname">${nm(c.port)} <code class="muted">${c.port}</code><small>${om?'Omitted on this voyage':'In rotation'}</small></span></td>
      <td class="num">${fmt(E(i))}${delayTo(i)?`<br><small class="fo">+${delayTo(i)} day${delayTo(i)>1?'s':''}</small>`:''}</td>
      <td class="num"><input type="number" min="0" max="10" id="dl-${i}" value="${S.sched.delay[i]||0}" aria-label="Delay at ${nm(c.port)} in days"> <button type="button" class="ghost sm" data-delay="${i}">Set</button></td>
      <td class="num">${aff.length?`${n0(t.teu)} TEU<br><small class="muted">${aff.length} bookings</small>`:'<span class="muted">—</span>'}</td>
      <td><div class="acts">${moved?'<span class="chip closed">Moved to next vessel</span>':om
        ? `${nid?`<button type="button" class="primary sm" data-movecall="${i}">Move to ${nv.vessel} ${nid}</button>`:'<span class="muted">No later vessel</span>'}<button type="button" class="ghost sm" data-unomit="${i}">Reinstate</button>`
        : `<button type="button" class="ghost sm relb" data-omit="${i}">Omit call</button>`}</div></td></tr>`; }).join('');
  return `<section class="panel" data-nav="Schedule changes"><div class="ph"><div><h2>Schedule changes · ${curVoy().vessel} ${V}</h2>
    <p>Delay a call to push its ETA, cut-off and forecast lock (and every later call) back. Omit a call, then move the allocation and bookings that load or discharge there to the next vessel in one go. Agents cannot book an omitted call.</p></div>
    <div class="acts">${S.sched.blank?'<span class="chip over">Sailing blanked</span>':armed==='blank'
      ? `<button type="button" class="danger armed" data-blank>Blank and move everything to ${nv?nv.vessel+' '+nid:'—'}</button><button type="button" class="ghost" data-disarm>Cancel</button>`
      : `<button type="button" class="danger" data-arm="blank" ${nid?'':'disabled'}>Blank this sailing</button>`}</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Call</th><th class="num">ETA</th><th class="num">Delay (days)</th><th class="num">Cargo here</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}

/* ================= Transhipment connection risk ================= */
// Weekly connecting-service days at each hub (0 = Sunday). Sample schedule: replace with the real long-term schedule.
const CONN_SCHED = {
  'SGSIN|JKS':{arr:1,dep:3}, 'SGSIN|VCS':{arr:2,dep:4}, 'SGSIN|ITS':{arr:3,dep:5},
  'MYWSP|SPE':{arr:4,dep:6}, 'MYWSP|WS2':{arr:5,dep:0}, 'CNNGB|NPE':{arr:6,dep:1}, 'CNSHA|NPE':{arr:0,dep:2}, 'INMUN|WS6':{arr:2,dep:3}
};
const dow = s => new Date(s+'T00:00:00').getDay();
// Inbound: days between the feeder's last arrival and our vessel at the hub. Outbound: days from our discharge to the next sailing.
function connInfo(b,hub,f,dir){
  if(!f.svc) return {cls:'okc',txt:'Daily '+f.land.toLowerCase(),days:null};
  const sc=CONN_SCHED[hub+'|'+f.svc]; if(!sc) return {cls:'closed',txt:'No schedule',days:null};
  const eta=E(ci(b,hub));
  if(dir==='in'){ const g=(dow(eta)-sc.arr+7)%7;
    return {days:g, date:addDays(eta,-g), cls:g>=2?'okc':g===1?'warnc':'over', txt:g>=2?`${g} days to connect`:g===1?'Tight · 1 day':'Same day · at risk'}; }
  const w=(sc.dep-dow(eta)+7)%7;
  return {days:w, date:addDays(eta,w), cls:w===0?'over':w===1?'warnc':w>=6?'warnc':'okc', txt:w===0?'Same day · at risk':w===1?'Tight · 1 day':w>=6?`Long wait · ${w} days`:`${w} days wait`};
}
const atRisk = c => c.cls==='over'||(c.cls==='warnc'&&c.days!==null);

/* ================= Contract allocation ================= */
// Space protection: allocation held for a named account on one port of load → port of discharge.
const contractsOf = (b,p,d) => S.contracts.filter(c=>c.b===b&&c.port===aKey(b,p)&&(!d||!c.pod||c.pod===d));
const ctUsed = c => vsum(S.bookings.filter(x=>x.b===c.b&&aKey(c.b,x.port)===c.port&&(!c.pod||x.pod===c.pod)&&x.customer===c.customer).map(pick));
const ctUnfilled = (b,p,except,d) => vsum(contractsOf(b,p,d).filter(c=>c.customer!==except).map(c=>vpos(vsub(pick(c),ctUsed(c)))));
// Spot cargo cannot use space still protected for an account on the same port pair.
const custLeft = (b,p,d,cust) => vsub(bookLeft(b,p,d), ctUnfilled(b,p,cust||null,d));
let ctEdit=null;
/* ================= Intra-Asia onward allocation ================= */
// Cargo transhipped onto connecting services is limited per port of load and destination, and per service intake at the hub.
const onCapOf = (b,p,f) => S.onCap[K(b,p,f)]||null;
const onUsed = (b,p,f) => vsum(S.bookings.filter(x=>x.b===b&&x.port===p&&x.fpd===f&&x.pod!==f).map(pick));
const svcCapOf = (b,hub,svc) => S.svcCap[K(b,hub,svc)]||null;
const svcUsed = (b,hub,svc) => vsum(S.bookings.filter(x=>x.b===b&&x.pod===hub&&x.fpd!==hub&&(onwardOf(b,hub,x.fpd)||{}).svc===svc).map(pick));
const capTxt = c => [c.teu!=null?`${n0(c.teu)} TEU`:'', c.mt!=null?`${n0(c.mt)} MT`:''].filter(Boolean).join(' / ');
const leftTxt = l => [isFinite(l.teu)?`${n0(Math.max(0,l.teu))} TEU`:'', isFinite(l.mt)?`${n0(Math.max(0,l.mt))} MT`:''].filter(Boolean).join(' / ');
// What an onward booking may still take, per TEU and MT: the tighter of the port limit and the service intake limit (null = no limit).
function onwardLeft(b,p,d,f){
  if(f===d) return null;
  const left={teu:Infinity,mt:Infinity}, why=[];
  const apply=(cap,u,label)=>{ let hit=false; DIMS.forEach(x=>{ if(cap[x.k]!=null){ const l=cap[x.k]-u[x.k]; if(l<left[x.k]){ left[x.k]=l; hit=true; } } }); if(hit) why.push(label); };
  const c=onCapOf(b,p,f); if(c) apply(c,onUsed(b,p,f),`ex ${nm(p)} into ${nm(f)} is limited to ${capTxt(c)}`);
  const o=onwardOf(b,d,f), sc=o&&o.svc?svcCapOf(b,d,o.svc):null;
  if(sc) apply(sc,svcUsed(b,d,o.svc),`${o.svc} intake at ${sn(d)} is limited to ${capTxt(sc)}`);
  return why.length?{left,why:why.join('; ')}:null;
}

/* ---- First-leg delay → intra-Asia connections, week by week ----
   Each of our voyages discharges at the hub, waits at least MIN_CONN days, then takes the next sailing of the connecting service.
   A delayed first leg slips to a later sailing: the planned week goes unfilled and the later week gets two vessels' cargo (bunching). */
const MIN_CONN = 1;
const voyDelayTo = (s,i) => Object.entries((s.sched||{}).delay||{}).reduce((a,[j,d])=>a+(+j<=i?d:0),0);
const nextDep = (date,dep) => addDays(date,(dep-dow(date)+7)%7);
let iaSel='';
function iaWeeks(b,hub,svc){
  const sc=CONN_SCHED[hub+'|'+svc]; if(!sc) return null;
  const dests=(BD(b).onward[hub]||[]).filter(f=>f.svc===svc).map(f=>f.port), i=ci(b,hub);
  const vs=VOYAGES.map(v=>{ const s=ALL.voyages[v.id], base=addDays(ROT[i].eta,v.wk*7), dl=voyDelayTo(s,i), eta=addDays(base,dl);
    const off=s.sched.blank||s.sched.omit[i];
    return {v, s, eta, dl, off, plan:nextDep(addDays(base,MIN_CONN),sc.dep), sail:off?null:nextDep(addDays(eta,MIN_CONN),sc.dep),
      bks:off?[]:s.bookings.filter(x=>x.b===b&&x.pod===hub&&dests.includes(x.fpd))}; });
  const dates=[...new Set(vs.flatMap(x=>[x.plan,x.sail]).filter(Boolean))].sort();
  return {sc,dests,vs,dates};
}
function iaWeekPanel(){
  const b=B, opts=[]; BD(b).pods.forEach(pod=>[...new Set((BD(b).onward[pod]||[]).filter(f=>f.svc&&CONN_SCHED[pod+'|'+f.svc]).map(f=>f.svc))].forEach(svc=>opts.push(pod+'|'+svc)));
  if(!opts.length) return '';

  const [hub,svc]=iaSel.split('|'), W=iaWeeks(b,hub,svc), cap=svcCapOf(b,hub,svc);
  const polsIn=[...new Set(W.vs.flatMap(x=>x.bks.map(k=>k.port)))];
  const polCap=p=>{ const cs=W.dests.map(f=>onCapOf(b,p,f)).filter(Boolean); if(!cs.length) return null; return {teu:cs.some(c=>c.teu!=null)?cs.reduce((a,c)=>a+(c.teu||0),0):null, mt:cs.some(c=>c.mt!=null)?cs.reduce((a,c)=>a+(c.mt||0),0):null}; };
  const over=(v,c)=>c&&DIMS.some(x=>c[x.k]!=null&&v[x.k]>c[x.k]);
  const cell=(v,c,planned,feeders)=>{ const any=vany(v);
    const cls=over(v,c)?'hm3':!any&&planned?'hm2':any?'hm1':'hmn';

    return `<td class="hm ${cls}">${any?`<b>${n0(v.teu)} TEU</b><small>${n0(v.mt)} MT</small>`:'<b>—</b>'}${feeders?`<small class="muted">${feeders}</small>`:''}${tag}</td>`; };
  // "Unfilled" only when one of our vessels was due on this sailing, had cargo for it, and slipped.
  const totRow=W.dates.map(d=>{ const f=W.vs.filter(x=>x.sail===d), v=vsum(f.flatMap(x=>x.bks).map(pick)), planned=W.vs.some(x=>x.plan===d&&x.sail!==d&&x.bks.length);
    return cell(v,cap,planned,f.map(x=>x.v.id).join(' + ')); }).join('');
  const polRows=polsIn.map(p=>{ const c=polCap(p);
    return `<tr><td><span class="pname">${nm(p)}<small>${c?`limit ${capTxt(c)} per vessel`:'no limit set'}</small></span></td>${W.dates.map(d=>{ const f=W.vs.filter(x=>x.sail===d), v=vsum(f.flatMap(x=>x.bks.filter(k=>k.port===p)).map(pick)), planned=W.vs.some(x=>x.plan===d&&!x.off&&ALL.voyages[x.v.id].bookings.some(k=>k.b===b&&k.port===p&&k.pod===hub&&W.dests.includes(k.fpd)));
      return cell(v,c,planned,''); }).join('')}</tr>`; }).join('');
  const legRows=W.vs.map(x=>`<tr><td><span class="pname">${x.v.vessel}<small>${x.v.id}${b==='WB'?'W':'E'}</small></span></td>
    <td class="num">${fmt(x.eta)}${x.dl?`<br><small class="fo">+${x.dl} day${x.dl>1?'s':''} late</small>`:''}</td>
    <td class="num">${fmt(x.plan)}</td><td class="num">${x.off?'—':fmt(x.sail)}</td>
    <td class="num">${tot(vsum(x.bks.map(pick)))}</td>
    <td>${x.off?'<span class="chip closed">Blanked / omitted</span>':x.sail===x.plan?'<span class="chip okc">On plan</span>':`<span class="chip over">Slips ${Math.round((new Date(x.sail)-new Date(x.plan))/864e5/7)} week</span>`}</td></tr>`).join('');
  return `<section class="panel" data-nav="First-leg delays"><div class="ph"><div><h2>First-leg delays and intra-Asia connections</h2>
    <p>Which ${svc} sailing at ${sn(hub)} each of our vessels actually connects to, allowing ${MIN_CONN} day at the hub. A late first leg leaves its planned sailing <b>unfilled</b> and doubles up the next one (<b>bunching</b>), so check both the service total and each port of load's own limit.</p></div>
    <div class="field"><label for="ia-sel">Service</label><select id="ia-sel">${opts.map(o=>{ const [h,s]=o.split('|'); return `<option value="${o}" ${o===iaSel?'selected':''}>${s} at ${sn(h)}</option>`; }).join('')}</select></div></div>
    <h3>First leg</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Our vessel</th><th class="num">ETA ${sn(hub)}</th><th class="num">Planned ${svc} sailing</th><th class="num">Actual ${svc} sailing</th><th class="num">Onward cargo</th><th>Status</th></tr></thead><tbody>${legRows}</tbody></table></div>
    <h3>${svc} sailings from ${sn(hub)} <small class="muted">cargo arriving from our vessels</small></h3>
    <div class="tbl-wrap scrolly"><table class="heat iaw"><thead><tr><th>Port of load</th>${W.dates.map(d=>`<th class="num">${fmt(d)}<small>${svc} sails</small></th>`).join('')}</tr></thead><tbody>
      <tr class="tot"><td><span class="pname">All ports<small>${cap?`intake limit ${capTxt(cap)} per sailing`:'no intake limit set'}</small></span></td>${totRow}</tr>
      ${polRows||`<tr><td colspan="${W.dates.length+1}" class="empty">No onward cargo booked for ${svc}.</td></tr>`}
    </tbody></table></div>
    <p class="note">Port limits are the per-vessel limits from the matrix above, added up across this service's destinations. Delays are set in Schedule changes for each voyage.</p>
  </section>`;
}
function iaPanel(){
  const b=B, dests=BD(b).pods.flatMap(pod=>(BD(b).onward[pod]||[]).filter(f=>f.svc).map(f=>({pod,f})));

  const ports=[]; BD(b).pols.forEach(pol=>groupPorts(b,pol).forEach(p=>(isGroup(b,p)?membersOf(b,p):[p]).forEach(x=>ports.push(x))));   // onward limits are per actual port
  const band=(u,c)=>{ if(!c) return ''; const r=Math.max(...DIMS.filter(x=>c[x.k]!=null&&c[x.k]>0).map(x=>u[x.k]/c[x.k]),0); return r>1?'hm3':r>=0.9?'hm2':'hm1'; };

  return `<section class="panel" data-nav="Intra-Asia onward"><div class="ph"><div><h2>Intra-Asia onward allocation · ${BD(b).label}</h2>

/* ================= Allocation template =================
   One standard weekly allocation per bound. Applying it fills the original allocation on the chosen vessels.
   Cells Trade changed on a vessel (S.ovr) are kept unless "replace" is ticked; nothing goes below what is already booked. */
const tmplRows = b => { const r=[]; BD(b).pols.forEach(pol=>{ r.push(pol); feedersOf(b,pol).forEach(f=>r.push(f)); }); return r; };
const tv = (b,p,d) => (ALL.tmpl[b]||{})[p+'|'+d]||{teu:0,mt:0};
function applyTemplate(b,ids,replace){
  const res={vessels:0,set:0,kept:0,raised:0};
  ids.forEach(id=>withVoy(id,()=>{
    if(S.sched.blank) return; res.vessels++;
    const keys=new Set([...Object.keys(ALL.tmpl[b]||{}), ...S.alloc.filter(a=>a.b===b).map(a=>a.port+'|'+a.pod)]);
    keys.forEach(k=>{
      const [p,d]=k.split('|');
      if(!replace && S.ovr[K(b,p,d)]){ res.kept++; return; }
      const t=tv(b,p,d), u=used(b,p,d), cur=base(b,p,d);
      // never below what is already booked (after releases and pool, booked counts against revised; keep it simple: original ≥ booked − extras)
      const floor=vpos(vsub(vsub(u,claimedIn(b,p,d)),extraIn(b,p,d)));
      const next={teu:Math.max(t.teu,floor.teu), mt:Math.max(t.mt,floor.mt)};
      if(next.teu>t.teu||next.mt>t.mt) res.raised++;
      if(next.teu!==cur.teu||next.mt!==cur.mt) res.set++;
      S.alloc=S.alloc.filter(a=>!(a.b===b&&a.port===p&&a.pod===d)); if(vany(next)) S.alloc.push({b,port:p,pod:d,...next});
      if(next.teu===t.teu&&next.mt===t.mt) delete S.ovr[K(b,p,d)]; else S.ovr[K(b,p,d)]=true;
    });
  }));
  return res;
}
let tmplFrom=null, tmplTo=null;

      <td class="num"><b>${n0(rt.teu)}</b><br><span class="wt">${n0(rt.mt)} MT</span></td></tr>`; }).join('');

  return `<section class="panel" data-nav="Allocation template"><div class="ph"><div><h2>Allocation template · ${BD(b).label}</h2>

    <span class="chip ${tTot.teu>VESSEL.cap.teu||tTot.mt>VESSEL.cap.mt?'over':'open'}">Template ${tot(tTot)} · capacity ${tot(VESSEL.cap)}</span></div>
    <div class="tbl-wrap"><table class="tmpl"><thead><tr><th>Port of load</th>${pods.map(d=>`<th class="num">→ ${sn(d)}<small>TEU · MT</small></th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${body}

    <div class="tmpl-apply">

// Room to protect on a port pair: its revised allocation less what other accounts already hold there.
const ctRoom = (b,p,d,exceptId) => vsub(eff(b,p,d), vsum(S.contracts.filter(c=>c.b===b&&c.port===aKey(b,p)&&c.pod===d&&c.id!==exceptId).map(pick)));
function contractPanel(){
  const list=S.contracts.slice().sort((a,c)=>a.b===c.b?(lci(a.b,a.port)-lci(c.b,c.port))||a.customer.localeCompare(c.customer):a.b<c.b?1:-1);
  const opts=[]; BD(B).pols.forEach(pol=>groupPorts(B,pol).forEach(p=>opts.push(p)));
  const state=(u,c)=>{ const r=c.teu?u.teu/c.teu:0; return r>=1?['okc','Filled']:r>=0.5?['open','Filling']:r>0?['warnc','Low use']:['over','Not used']; };
  const sum=b=>{ const l=list.filter(c=>c.b===b), P=vsum(l.map(pick)), U=vsum(l.map(c=>{ const u=ctUsed(c); return {teu:Math.min(u.teu,c.teu),mt:Math.min(u.mt,c.mt)}; }));

/* ================= Heatmap ================= */
let heatMetric='max';
function heatPanel(){
  const b=B, cols=VOYAGES;
  const val=(p)=>{ const e=effP(b,p), u=usedP(b,p), f=fcP(b,p); const v=heatMetric==='booked'?u:heatMetric==='forecast'?f:{teu:Math.max(u.teu,f.teu),mt:Math.max(u.mt,f.mt)}; return {e,v}; };
  const cell=(e,v)=>{ if(!e.teu) return '<td class="hm hmn">—</td>'; const r=Math.max(v.teu/e.teu, e.mt?v.mt/e.mt:0), c=r>1?'hm3':r>=0.9?'hm2':r>=0.6?'hm1':'hm0';
    return `<td class="hm ${c}" title="${n0(v.teu)} / ${n0(e.teu)} TEU · ${n0(v.mt)} / ${n0(e.mt)} MT"><b>${Math.round(r*100)}%</b><small>${n0(v.teu)}/${n0(e.teu)}</small></td>`; };
  const rows=BD(b).pols.map(pol=>{ const ports=[pol,...feedersOf(b,pol)];

    <div class="field"><label for="hm-metric">Show</label><select id="hm-metric"><option value="max" ${heatMetric==='max'?'selected':''}>Higher of booked or forecast</option><option value="booked" ${heatMetric==='booked'?'selected':''}>Booked</option><option value="forecast" ${heatMetric==='forecast'?'selected':''}>Forecast</option></select></div></div>
    <div class="tbl-wrap"><table class="heat"><thead><tr><th>Load call</th>${cols.map(c=>`<th class="num ${c.id===V?'cur':''}">${c.vessel}<small>${c.id}${b==='WB'?'W':'E'} · ETA ${fmt(addDays(ROT[BD(b).calls[0]].eta,c.wk*7))}</small></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>

/* ================= Workspaces =================

function wsOf(el){
  if(el.dataset.ws) return el.dataset.ws;

  if(el.classList.contains('route')) return ['plan','home','book'].includes(cur)?cur:'_';   // the board needs the room on Allocation

// Where the voyage is in the weekly cycle, for the whole bound (HQ) or one port (agent).
const PHASES=['Allocation & forecast','Booking','Cut-off','After sailing'];
function phaseOf(b,p){
  const calls=p?[lci(b,p)]:BD(b).pols.map(x=>ci(b,x)), first=Math.min(...calls), last=Math.max(...calls);
  const days=Math.round((new Date(addDays(E(first),-1))-new Date(TODAY))/864e5);
  return {i: TODAY>=E(last)?3 : days<=3?2 : days<=14?1 : 0, days};
}
function nextCutoff(b,p){
  const ports=p?[loadCall(b,p)]:BD(b).pols;
  return ports.map(x=>({p:x,d:addDays(E(ci(b,x)),-1)})).filter(x=>x.d>=TODAY).sort((a,c)=>a.d<c.d?-1:1)[0]||null;
}
const daysTo = d => Math.round((new Date(d)-new Date(TODAY))/864e5);
const whenTxt = d => { const n=daysTo(d); return n===0?'today':n===1?'tomorrow':n<0?`${-n} days ago`:`in ${n} days`; };

// HQ: everything that needs a decision on the selected voyage and bound.
function hqItems(){
  const b=B, it=[];
  const pend=S.requests.filter(r=>r.b===b&&r.status==='pending');
  if(pend.length) it.push({sev:'act',ws:'alloc',nav:'Additional loading',title:`${pend.length} additional loading request${pend.length>1?'s':''} waiting`,detail:`${tot(vsum(pend.map(pick)))} from ${[...new Set(pend.map(r=>nm(r.port)))].join(', ')}`,btn:'Review'});
  const due=rulesDue();
  if(due.length) it.push({sev:'act',ws:'rules',nav:'Release rules',title:`${due.length} release${due.length>1?'s':''} due by your rules`,detail:due.slice(0,4).map(d=>`${nm(d.p)} stage ${d.i+1} (${pct(d.util)} booked)`).join(', ')+(due.length>4?'…':''),btn:'View',extra:'<button type="button" class="primary sm" data-applyrules>Apply all</button>'});
  const L=legs(), over=L.map((l,i)=>({l,i})).filter(x=>DIMS.some(d=>x.l.alloc[d.k]>VESSEL.cap[d.k])||x.l.rf.booked+x.l.rf.held>VESSEL.plugs);
  if(over.length) it.push({sev:'act',ws:'alloc',nav:'Allocation board',title:`Vessel over capacity on ${over.length} leg${over.length>1?'s':''}`,detail:over.map(x=>`${ROT[x.i].port.slice(2)}→${ROT[x.i+1].port.slice(2)}`).join(', '),btn:'Open board'});
  const om=Object.keys(S.sched.omit).filter(i=>!S.sched.moved[i]);
  if(om.length) it.push({sev:'act',ws:'plan',nav:'Schedule changes',title:`Omitted call${om.length>1?'s':''} with cargo still on this vessel`,detail:om.map(i=>nm(ROT[i].port)).join(', '),btn:'Move cargo'});
  // Intra-Asia bunching / unfilled sailings caused by first-leg timing
  BD(b).pods.forEach(pod=>[...new Set((BD(b).onward[pod]||[]).filter(f=>f.svc&&CONN_SCHED[pod+'|'+f.svc]).map(f=>f.svc))].forEach(svc=>{
    const W=iaWeeks(b,pod,svc), cap=svcCapOf(b,pod,svc); let bunch=0, unf=0;
    W.dates.forEach(d=>{ const v=vsum(W.vs.filter(x=>x.sail===d).flatMap(x=>x.bks).map(pick)); if(cap&&DIMS.some(x=>cap[x.k]!=null&&v[x.k]>cap[x.k])) bunch++; if(!vany(v)&&W.vs.some(x=>x.plan===d&&x.sail!==d&&x.bks.length)) unf++; });
    if(bunch||unf) it.push({sev:bunch?'act':'watch',ws:'conn',nav:'First-leg delays',ia:pod+'|'+svc,title:`${svc} at ${sn(pod)}: ${[bunch?`${bunch} sailing${bunch>1?'s':''} bunching`:'',unf?`${unf} unfilled`:''].filter(Boolean).join(', ')}`,detail:'First-leg timing moves cargo onto the wrong intra-Asia sailing',btn:'View'});
  }));
  const risky=[]; BD(b).pods.forEach(pod=>(BD(b).onward[pod]||[]).forEach(f=>{ const c=connInfo(b,pod,f,'out'); if(atRisk(c)&&S.bookings.some(x=>x.b===b&&x.pod===pod&&x.fpd===f.port)) risky.push(`${sn(pod)}→${f.port.slice(2)}`); }));
  BD(b).pols.forEach(pol=>(BD(b).feeders[pol]||[]).forEach(f=>{ const c=connInfo(b,pol,f,'in'); if(atRisk(c)&&origins(b).includes(f.port)&&usedP(b,f.port).teu) risky.push(`${f.port.slice(2)}→${sn(pol)}`); }));
  if(risky.length) it.push({sev:'watch',ws:'conn',nav:'Connections',title:`${risky.length} tight connection${risky.length>1?'s':''} with cargo`,detail:risky.join(', '),btn:'View'});
  const nv=nextVoys(); let rq=Z(), fo=Z();
  nv.forEach(c=>withVoy(c.id,()=>origins(b).forEach(p=>{ rq=vadd(rq,pendP(b,p)); fo=vadd(fo,fcOver(b,p)); })));
  if(vany(rq)||vany(fo)) it.push({sev:'watch',ws:'plan',nav:'Next vessels',title:'Rollover building on the next vessels',detail:[vany(rq)?`${tot(rq)} waiting approval`:'',vany(fo)?`forecast ${tot(fo)} above allocation`:''].filter(Boolean).join(' · '),btn:'Plan'});
  const noFc=origins(b).filter(p=>loadsIn(b,p)&&!fcLocked(b,p)&&daysTo(fcLockDate(b,p))<=7&&BD(b).pods.some(d=>vany(base(b,p,d))&&!hasFc(b,p,d)));
  if(noFc.length) it.push({sev:'watch',ws:'alloc',nav:'Allocation board',title:`${noFc.length} port${noFc.length>1?'s':''} still missing forecast, locking within 7 days`,detail:noFc.map(nm).join(', '),btn:'Open board'});
  const noLoad=origins(b).filter(p=>sailed(b,p)&&usedP(b,p).teu&&!loadedP(b,p));
  if(noLoad.length) it.push({sev:'watch',ws:'perf',nav:'Load list',title:`Load list not entered for ${noLoad.length} sailed port${noLoad.length>1?'s':''}`,detail:noLoad.map(nm).join(', '),btn:'Enter'});
  const pool=vsum(origins(b).map(p=>poolFrom(b,p)));
  if(vany(pool)) it.push({sev:'info',ws:'alloc',nav:'Balance pool',title:`${tot(pool)} in the balance pool`,detail:'Released by upstream ports, available to later calls',btn:'View'});
  return it;
}
// Agent: the few things this port should do now.
function agItems(){
  const b=B, p=role, it=[];

  if(msgs.length) it.push({sev:'act',ws:'home',nav:'',title:`${msgs.length} message${msgs.length>1?'s':''} from HQ Trade`,detail:'Decisions on your additional loading requests, shown above',btn:''});

  if(!fcLocked(b,p)&&missing.length) it.push({sev:daysTo(fcLockDate(b,p))<=7?'act':'watch',ws:'forecast',nav:'Forecast',title:`Forecast missing for ${missing.map(sn).join(', ')}`,detail:`Locks ${fmt(fcLockDate(b,p))} (${whenTxt(fcLockDate(b,p))})`,btn:'Enter forecast'});
  const co=addDays(E(li),-1), left=vpos(vsub(effP(b,p),usedP(b,p)));

  const pend=reqs(b,p,'pending'); if(pend.length) it.push({sev:'info',ws:'book',nav:'Book cargo',title:`${pend.length} request${pend.length>1?'s':''} waiting for HQ`,detail:tot(vsum(pend.map(pick))),btn:'View'});
  const src=origins(b).filter(u=>u!==p&&vany(poolFrom(b,u))&&lci(b,u)<=li);
  if(src.length) it.push({sev:'info',ws:'pool',nav:'Balance you can use',title:`${tot(vsum(src.map(u=>poolFrom(b,u))))} released ahead of you`,detail:`From ${src.map(nm).join(', ')}`,btn:'Take balance'});
  const full=Object.keys(S.onCap).filter(k=>k.startsWith(b+'|'+p+'|')).map(k=>k.split('|')[2]).filter(f=>{ const c=S.onCap[K(b,p,f)], u=onUsed(b,p,f); return DIMS.some(x=>c[x.k]!=null&&u[x.k]>=c[x.k]); });
  if(full.length) it.push({sev:'watch',ws:'book',nav:'Book cargo',title:`Intra-Asia limit reached into ${full.map(nm).join(', ')}`,detail:'Ask HQ Trade if you need more onward space',btn:'Book'});
  return it;
}
function todayPanel(items){

function withBound(b,fn){ const k=B; B=b; try{ return fn(); } finally{ B=k; } }

/* ---- Stage bar: where the vessel is in its cycle (context, always on screen). Click a stage for its checklist. ---- */
let stageSel=null;
// Which stages each kind of action belongs to, by the screen it opens.
const PH_BY_NAV={'Additional loading':[1,2],'Release rules':[2],'Allocation board':[0,1,2],'Schedule changes':[1,2],'First-leg delays':[1,2],'Connections':[1,2],
  'Next vessels':[0,1],'Load list':[3],'Balance pool':[1,2],'Forecast':[0,1],'Book cargo':[1,2],'Balance you can use':[1,2]};
const phOf = i => PH_BY_NAV[i.nav] || [0,1,2,3];
const STAGE_GO_HQ=[['alloc','Allocation board','Open allocation board'],['alloc','Allocation board','Open allocation board'],['rules','Release rules','Open release rules'],['perf','Load list','Open load list']];
const STAGE_GO_AG=[['forecast','Forecast','Open forecast'],['book','Book cargo','Book cargo'],['book','Book cargo','Book cargo'],['cargo','','Open my cargo']];
// Checks that only matter in one stage.
function stageExtra(i){
  const b=B, it=[], ports=origins(b).filter(p=>loadsIn(b,p));
  if(role!=='HQ'){
    const p=role, e=effP(b,p), u=usedP(b,p);
    if(i===1&&e.teu&&u.teu/e.teu<0.5) it.push({sev:'watch',ws:'book',nav:'Book cargo',title:`You are ${pct(u.teu/e.teu)} booked`,detail:`${tot(vpos(vsub(e,u)))} still open`,btn:'Book'});
    return it;
  }
  if(i===0){ const fo=ports.filter(p=>vany(fcOver(b,p))); if(fo.length) it.push({sev:'watch',ws:'alloc',nav:'Allocation board',title:`Forecast above allocation at ${fo.length} port${fo.length>1?'s':''}`,detail:fo.map(nm).join(', '),btn:'Adjust'}); }
  if(i===1){ const lo=ports.filter(p=>!closedP(b,p)&&effP(b,p).teu&&usedP(b,p).teu/effP(b,p).teu<0.5); if(lo.length) it.push({sev:'watch',ws:'alloc',nav:'Allocation board',title:`${lo.length} port${lo.length>1?'s':''} under 50% booked`,detail:lo.map(nm).join(', '),btn:'Open board'}); }
  if(i===3){ const ns=ports.filter(p=>{ const L=loadedP(b,p), U=usedP(b,p); return L&&U.teu&&L.teu<U.teu*0.95; });
    if(ns.length) it.push({sev:'watch',ws:'perf',nav:'Load list',title:`No-shows above 5% at ${ns.length} port${ns.length>1?'s':''}`,detail:ns.map(p=>`${nm(p)} ${pct(1-loadedP(b,p).teu/usedP(b,p).teu)}`).join(', '),btn:'Load list'}); }
  return it;
}
function stageBar(items){
  const hq=role==='HQ', b=B; if(!hq&&!loadsIn(b,role)) return '';
  const ph=hq?phaseOf(b):phaseOf(b,role), sel=stageSel, go=(hq?STAGE_GO_HQ:STAGE_GO_AG);
  const rank={act:0,watch:1,info:2};
  const list = sel===null ? null : [...items.filter(i=>phOf(i).includes(sel)), ...stageExtra(sel)].sort((a,c)=>rank[a.sev]-rank[c.sev]);

      ${rows?`<ul class="inbox">${rows}</ul>`:'<p class="empty">Nothing outstanding for this stage.</p>'}</div>`
      :`<p class="note">${nc?`Next cut-off: <b>${nm(nc.p)} ${fmt(nc.d)}</b> (${whenTxt(nc.d)}).`:'All cut-offs on this leg have passed.'} Click a stage to see its checklist.</p>`}
  </div>`;
}

// Fit the allocation board into the window: no sideways or downward scrolling. Scales down, never below 70%.
function fitBoard(){
  const sec=[...document.querySelectorAll('#app [data-nav="Allocation board"]')].find(s=>!s.hidden); if(!sec) return;
  const wrap=sec.querySelector('.tbl-wrap'), t=wrap&&wrap.querySelector('table.board'); if(!t) return;
  wrap.classList.add('fit'); t.style.zoom=1;
  const top=wrap.getBoundingClientRect().top+window.scrollY;
  const availW=wrap.clientWidth-2, availH=window.innerHeight-top-14;
  const z=Math.max(0.7, Math.min(1, availW/t.scrollWidth, availH>200?availH/t.scrollHeight:1));
  t.style.zoom=z<0.995?z.toFixed(3):'';
}

    const v=Math.max(0,parseInt(raw,10)||0);
    if(v<u){ t.value=rfA(b,p)??''; return toast(`${nm(p)} already uses ${u} plugs`,true); }
    S.rfAlloc[K(b,p)]=v; addLog(`HQ set the reefer BSA for ${nm(p)} to ${v} plugs.`);
    render(); toast(legOver()?'Saved. Reefer plugs are now over the vessel limit on a leg.':`Reefer BSA for ${nm(p)}: ${v} plugs`, legOver());
  }
  if(t.id==='perf-period'){ perfPeriod=t.value; render(); return; }
  if(t.id==='ob-on'||t.id==='ob-cap'){
    ALL.ob={on:document.getElementById('ob-on').checked, cap:parseFloat(document.getElementById('ob-cap').value)};
    addLog(ALL.ob.on?`HQ allowed overbooking by no-show rate, capped at ${pct(ALL.ob.cap)}.`:'HQ turned off overbooking by no-show rate.');
    render(); toast(ALL.ob.on?`Overbooking allowed up to ${pct(ALL.ob.cap)}`:'Overbooking off'); return;
  }
  if(t.id==='na-port') naPods();
  if(t.id==='bk-pod') bkFpd();
  if(t.id==='bk-fpd'||t.id==='bk-dgc'||t.id==='bk-cust') bkHint();
  if(t.dataset.stage){ const [i,k]=t.dataset.stage.split('|'), v=Math.max(0,parseFloat(t.value)||0); ALL.rules.stages[+i][k]=k==='days'?v:v/100; render(); return; }
  if(t.id==='rl-on'){ ALL.rules.on=t.checked; addLog(`HQ turned release rules ${t.checked?'on':'off'}.`); render(); return; }
  if(t.id==='hm-metric'){ heatMetric=t.value; render(); return; }
  if(t.dataset.oncap||t.dataset.svccap){
    const isSvc=!!t.dataset.svccap, [b,x,y,dim]=(t.dataset.oncap||t.dataset.svccap).split('|'), key=K(b,x,y), raw=t.value.trim(), store=isSvc?S.svcCap:S.onCap;
    const c={...(store[key]||{})}; if(raw==='') delete c[dim]; else c[dim]=Math.max(0,parseFloat(raw)||0);
    if(c.teu==null&&c.mt==null) delete store[key]; else store[key]=c;
    const what=store[key]?`max ${capTxt(store[key])}`:'no limit';
    addLog(isSvc?`HQ set ${y} intake at ${nm(x)} to ${what}.`:`HQ set onward limit ex ${nm(x)} into ${nm(y)} to ${what}.`);
    render(); toast('Intra-Asia limit saved'); return;
  }
  if(t.id==='ia-sel'){ iaSel=t.value; render(); return; }
  if(t.dataset.tmpl){
    const [b,p,d,dim]=t.dataset.tmpl.split('|'), k=p+'|'+d, c={...(ALL.tmpl[b][k]||{teu:0,mt:0})};
    c[dim]=Math.max(0,parseFloat(t.value)||0);
    if(!c.teu&&!c.mt) delete ALL.tmpl[b][k]; else ALL.tmpl[b][k]=c;
    addLog(`HQ set template ${nm(p)} → ${sn(d)} to ${tot(c)}.`); render(); toast('Template updated. Apply it to vessels when ready.'); return;
  }
  if(t.id==='tp-from'){ tmplFrom=+t.value; if(tmplTo<tmplFrom) tmplTo=tmplFrom; render(); return; }
  if(t.id==='tp-to'){ tmplTo=+t.value; if(tmplFrom>tmplTo) tmplFrom=tmplTo; render(); return; }
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f-alloc'){
    const p=document.getElementById('na-port').value, d=document.getElementById('na-pod').value;
    const v={teu:parseInt(document.getElementById('na-teu').value,10)||0, mt:parseFloat(document.getElementById('na-mt').value)||0};
    if(!d) return toast('No discharge port comes after this port on this bound',true);
    if(!vany(v)) return toast('Enter TEU or tonnage above zero',true);
    const a=S.alloc.find(x=>x.b===B&&x.port===p&&x.pod===d); if(a){ a.teu+=v.teu; a.mt+=v.mt; } else S.alloc.push({b:B,port:p,pod:d,...v});
    const fi=feedInfo(B,p);
    addLog(`HQ released ${n0(v.teu)} TEU / ${n0(v.mt)} MT to ${nm(p)} for ${sn(d)}${fi?` (grouped under ${sn(fi.hub)})`:''}.`);
    render(); toast(legOver()?'Added. The vessel is now over capacity on a leg.':`Added ${n0(v.teu)} TEU / ${n0(v.mt)} MT to ${nm(p)} → ${sn(d)}`, legOver());
  }
  if(e.target.id==='f-ct'){
    const p=document.getElementById('ct-port').value, d=document.getElementById('ct-pod').value, cust=document.getElementById('ct-cust').value.trim();
    const v={teu:Math.max(0,parseInt(document.getElementById('ct-teu').value,10)||0), mt:Math.max(0,parseFloat(document.getElementById('ct-mt').value)||0)};
    if(!cust) return toast('Enter the account name',true);
    if(!podOK(B,p,d)) return toast(`${nm(d)} comes before ${nm(p)} in the rotation`,true);
    if(!v.teu) return toast('Enter TEU to protect',true);
    const room=ctRoom(B,p,d,null), short=DIMS.find(x=>v[x.k]>room[x.k]);
    if(short) return toast(`${nm(p)} → ${sn(d)} only has ${tot(vpos(room))} of allocation not already protected`,true);
    S.contracts.push({id:uid(),b:B,port:aKey(B,p),pod:d,customer:cust,...v});
    addLog(`HQ protected ${tot(v)} on ${nm(p)} → ${sn(d)} for ${cust}.`); render(); toast(`Protected ${tot(v)} on ${nm(p)} → ${sn(d)} for ${cust}`); return;
  }
  if(e.target.id==='f-book'){
    const p=role, d=document.getElementById('bk-pod').value, f=document.getElementById('bk-fpd').value, ref=document.getElementById('bk-ref').value.trim();
    const g=id=>Math.max(0,parseInt(document.getElementById(id).value,10)||0);
    const e20=g('bk-e20'), e40=g('bk-e40'), ehc=g('bk-ehc'), dg=g('bk-dg'), dgc=parseInt(document.getElementById('bk-dgc').value,10), oog=g('bk-oog');
    const boxes=e20+e40+ehc, lost=oog*g('bk-lost');
    const v={teu:e20+2*(e40+ehc)+lost, mt:parseFloat(document.getElementById('bk-mt').value)||0};
    const sp={e20,e40,ehc,dg,dgc:dg?dgc:null,oog,lost};
    const rf=Math.max(0,parseInt(document.getElementById('bk-rf').value,10)||0), rfTeu=Math.max(0,parseInt(document.getElementById('bk-rfteu').value,10)||0);
    if(!ref) return toast('Enter a booking ref',true);
    if(!d) return toast('No discharge port available',true);
    if(!boxes) return toast('Enter at least one container',true);
    if(dg>boxes||oog>boxes||rf>boxes) return toast('DG, out-of-gauge and reefer units cannot be more than the boxes booked',true);
    if(dg){ const ban=dgBanned(B,p,d,dgc); if(ban.length) return toast(`Class ${dgc} DG is not accepted at ${ban.map(sn).join(' and ')}. Booking blocked.`,true); }
    if(dg||oog){ const sr=spRoom(B,p,d);
      if(dg>sr.dg) return toast(`Vessel DG limit: only ${Math.max(0,sr.dg)} DG units free between ${sn(loadCall(B,p))} and ${sn(d)}`,true);
      if(oog>sr.oog) return toast(`Vessel out-of-gauge limit: only ${Math.max(0,sr.oog)} OOG units free between ${sn(loadCall(B,p))} and ${sn(d)}`,true); }
    if(!(v.mt>0)) return toast('Enter the gross weight in MT',true);
    if(rf && rfTeu<rf) return toast('Reefer TEU must be at least the number of reefer units',true);
    if(rfTeu>v.teu) return toast('Reefer TEU cannot be more than the booking TEU',true);
    if(rfTeu && !rf) return toast('Enter how many reefer units (plugs) this booking needs',true);
    const ol=onwardLeft(B,p,d,f);
    if(ol && (v.teu>ol.left.teu || v.mt>ol.left.mt)) return toast(`Intra-Asia limit: ${ol.why}; ${leftTxt(ol.left)} left. Booking blocked.`,true);
    const cust=document.getElementById('bk-cust')?.value||'';
    if(S.sched.blank) return toast('This sailing is blanked. Book on the next vessel.',true);
    if(omitted(lci(B,p))||omitted(ci(B,d))) return toast(`${omitted(lci(B,p))?sn(loadCall(B,p)):sn(d)} is omitted on this voyage. Book on the next vessel.`,true);
    const left=custLeft(B,p,d,cust); const short=DIMS.find(x=>v[x.k]>left[x.k]);
    const reserveNote = !cust && vany(ctUnfilled(B,p,null,d)) ? ` ${tot(ctUnfilled(B,p,null,d))} to ${sn(d)} is protected for accounts.` : '';
    if(short){
      askDraft={b:B,port:p,pod:d,fpd:f,ref,...v,rf,rfTeu,...sp,customer:cust||undefined};
      const h=document.getElementById('bk-hint'); h.className='hint ask';
      h.innerHTML=`<span><b>Blocked.</b> Only ${n0(Math.max(0,left.teu))} TEU / ${n0(Math.max(0,left.mt))} MT left to ${sn(d)}.${reserveNote} Take balance from the pool, or ask HQ to approve additional loading.</span><button type="button" class="primary" data-ask>Request ${n0(v.teu)} TEU / ${n0(v.mt)} MT from HQ</button>`;
      return toast(`Over your ${short.u} allocation to ${sn(d)}. Booking blocked.`,true);
    }
    if(rf){
      const a=rfA(B,p);
      if(a!==undefined){ if(rf>a-rfUsed(B,p)) return toast(`Only ${Math.max(0,a-rfUsed(B,p))} plugs left in your reefer BSA. Ask HQ for more.`,true); }
      else { const room=rfRoom(B,p,d); if(rf>room) return toast(`Only ${Math.max(0,room)} vessel plugs free between ${sn(loadCall(B,p))} and ${sn(d)}`,true); }
    }
    S.bookings.push({id:uid(),b:B,ref,port:p,pod:d,fpd:f,...v,rf,rfTeu,...sp,customer:cust||undefined});
    render(); toast(`Booked ${ref}: ${boxes} boxes, ${n0(v.teu)} TEU / ${n0(v.mt)} MT${rf?` / ${rf} reefer`:''}${dg?` / ${dg} DG`:''}${oog?` / ${oog} OOG`:''} to ${nm(f)}`);
  }
});

render();
</script>
