<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cargoflow Mgnt Tool</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one operating column. Full round-voyage rotation on top (shared truth for both bounds), bound + role desk below. */
/* Theme: Sea Hawk portal look. Dark-first navy, violet interaction, magenta route/tonnage, cyan reefer, gold markers. */
:root{
  --bg:#090D18; --surface:#10162A; --surface-2:#161D33; --ink:#E7EBF5; --muted:#8B94AD; --line:#232C45;
  --accent:#7C6BFF; --accent-soft:#221E4A; --navy:#4F8DFF; --navy-soft:#16244A;
  --ok:#22C55E; --ok-soft:#0F2E1E; --warn:#F5B83D; --warn-soft:#33280F; --bad:#F05252; --bad-soft:#3A1518;
  --wt:#E04CF0; --wt-soft:#321539; --rf:#22D3EE; --rf-soft:#0E2D36;
  --topbg:#0C1122; --topfg:#E7EBF5; --side:#0C1122; --glow:rgba(124,107,255,.45); --route:#D946EF; --gold:#FACC15; --brand:#E5262A;
  --f-display:"Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F0F3F9; --ink:#121828; --muted:#5D667D; --line:#DCE1EC;
  --accent:#5B4BE0; --accent-soft:#ECE9FF; --navy:#2563EB; --navy-soft:#E3ECFF;
  --ok:#15803D; --ok-soft:#DCF5E5; --warn:#A16207; --warn-soft:#FBF0D5; --bad:#C62828; --bad-soft:#FCE1E1;
  --wt:#A21CAF; --wt-soft:#F7E3FA; --rf:#0E7490; --rf-soft:#DDF4F8;
  --topbg:#FFFFFF; --topfg:#121828; --side:#FFFFFF; --glow:rgba(91,75,224,.22); --route:#C026D3; --gold:#CA8A04; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F0F3F9; --ink:#121828; --muted:#5D667D; --line:#DCE1EC;
  --accent:#5B4BE0; --accent-soft:#ECE9FF; --navy:#2563EB; --navy-soft:#E3ECFF;
  --ok:#15803D; --ok-soft:#DCF5E5; --warn:#A16207; --warn-soft:#FBF0D5; --bad:#C62828; --bad-soft:#FCE1E1;
  --wt:#A21CAF; --wt-soft:#F7E3FA; --rf:#0E7490; --rf-soft:#DDF4F8;
  --topbg:#FFFFFF; --topfg:#121828; --side:#FFFFFF; --glow:rgba(91,75,224,.22); --route:#C026D3; --gold:#CA8A04; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}   /* workspaces hide panels with the hidden attribute */
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
/* Landscape: use the full screen width; on wide screens secondary panels sit side by side. */
.wrap{width:100%;max-width:2200px;margin:0 auto;padding-inline:24px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.25rem;font-weight:750}
h3{font-size:1rem;font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.82em}
.num{font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-stretch:80%;text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;font-weight:700;color:var(--muted)}

/* app shell: sidebar + top KPI bar */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;border-bottom:1px solid var(--line)}
.pil-logo{width:92px;height:auto;display:block;flex:none}
:root{--logo-blue:#2A6FE0}
.pil{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:1.5rem;letter-spacing:.02em;color:var(--brand);line-height:1}
.pil i{display:inline-block;width:14px;height:3px;background:var(--navy);margin-right:4px;vertical-align:middle;border-radius:2px;box-shadow:0 5px 0 var(--navy),0 -5px 0 var(--navy)}
.side-sec{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 4px 0}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:500;border:1px solid transparent}
#nav a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
#nav a:hover{background:var(--surface-2)}
#nav a.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 14px var(--glow)}
#nav a.on::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.side .field{gap:5px}
.side select{width:100%}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--topbg);color:var(--topfg);border-bottom:1px solid var(--line)}
.top-in{padding:10px 24px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.brand-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,var(--navy),var(--accent-soft) 70%);box-shadow:0 0 16px var(--glow);color:#fff;font-size:1rem}
.brand h1{font-size:1.05rem;font-weight:700;color:var(--topfg);letter-spacing:0}
.brand span{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
/* KPI strip: one soft box of equal tiles with hairline dividers, taking the space between title and theme toggle */
.kpis{flex:1 1 560px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;padding:8px 12px;box-shadow:-1px 0 0 var(--line)}
@media (max-width:1600px){ .brand span{display:none} .brand h1{font-size:.95rem} .top-in{gap:10px 16px} .kpi b{font-size:.95rem!important} }
.kpi span{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.kpi b{font-size:.98rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{overflow:hidden;text-overflow:ellipsis;letter-spacing:.08em!important}
.kpi b{font-size:1.05rem!important;line-height:1.2}
.kpi b small{display:block;font-size:.74rem;font-weight:600;margin-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.seg button{border:0;border-radius:999px;background:transparent;color:var(--muted);padding:5px 12px;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 1px var(--accent),0 0 12px var(--glow)}
.seg button:hover{color:var(--ink);background:transparent}
.seg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.side .seg{display:flex}.side .seg button{flex:1}
[id]{scroll-margin-top:84px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  #nav{flex-direction:row;flex-wrap:wrap}
}

select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{width:5.4em;text-align:right;font-variant-numeric:tabular-nums}
input.mt{width:6.2em}
input::placeholder{color:var(--muted)}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;transition:background .15s, transform .1s}
button:hover{background:var(--surface-2)}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.06);background:var(--accent)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.danger.armed{background:var(--bad);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--bad);background:var(--bad-soft)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.primary{box-shadow:0 0 14px var(--glow)}
.panel{border-radius:12px!important}
.route{background-color:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.leg .arrow{height:0;border-top:2px dashed var(--route);margin:4px 0;font-size:0;opacity:.85}
.call.load{box-shadow:0 0 0 1px transparent}
.call .nm::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);margin-right:6px;vertical-align:middle}
.call.other .nm::before{background:var(--muted);box-shadow:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.voyage{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end;justify-content:space-between;padding-block:22px 14px}
.voyage h2{font-size:1.7rem;font-weight:800}
.voyage .facts{display:flex;gap:22px;flex-wrap:wrap}
.fact b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.15}
.fact b small{display:block;font-size:.8rem;font-weight:600;color:var(--wt)}
.fact.rff b{color:var(--rf)} .fact.rff b small{color:var(--rf)}
.sample{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:6px}

/* rotation strip */
.route{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.route-key{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.route-key i{display:inline-block;width:12px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle}
.calls{display:flex;align-items:stretch;list-style:none;margin:0;padding:0;min-width:max-content}
.call{width:160px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.call.load{border-top:3px solid var(--navy)}
.call.dis{border-top:3px solid var(--accent)}
.call.load.dis{border-top:3px solid var(--navy);box-shadow:inset 0 -3px 0 var(--accent)}
.call.other{opacity:.5;border-style:dashed}
.call.me{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.call .nm{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:1.02rem}
.call .ln{font-size:.78rem;color:var(--muted)}
.call .ln b{color:var(--ink)}
.call .ln.rfl{color:var(--rf)}
.call .ln.dl{border-top:1px dashed var(--line);padding-top:3px;margin-top:2px}
.call .fd{font-size:.74rem;color:var(--navy);background:var(--navy-soft);border-radius:4px;padding:2px 6px;margin-top:2px}
.leg{width:116px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 8px;font-size:.72rem;color:var(--muted)}
.leg .lb{text-align:center;line-height:1.25}
.leg .lb b{color:var(--ink)}
.leg .lb.over b{color:var(--bad)}
.leg .lb.rfl b{color:var(--rf)}
.legbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.legbar i{display:block;height:100%}
.legbar .b{background:var(--navy)} .legbar .a{background:var(--navy);opacity:.35}
.legbar.mtb .b{background:var(--wt)} .legbar.mtb .a{background:var(--wt);opacity:.35}
.legbar.rfb .b{background:var(--rf)} .legbar.rfb .a{background:var(--rf);opacity:.35}
.legbar.over .a,.legbar.over .b{background:var(--bad);opacity:1}
.leg .arrow{text-align:center;color:var(--muted);font-size:1rem;line-height:1}

.meter{display:inline-block;width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--navy);border-radius:3px}
.meter.mtm i{background:var(--wt)}
.meter.rfm i{background:var(--rf)}
.meter.full i{background:var(--ok)} .meter.over i{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.open{background:var(--navy-soft);color:var(--navy)}
.chip.full{background:var(--ok-soft);color:var(--ok)}
.chip.wfull{background:var(--wt-soft);color:var(--wt)}
.chip.closed{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.over{background:var(--bad-soft);color:var(--bad)}
.chip.ts{background:var(--accent-soft);color:var(--accent)}
.chip.direct{background:var(--ok-soft);color:var(--ok)}
.chip.rfc{background:var(--rf-soft);color:var(--rf)}
.tag{font-size:.72rem;font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap}
.tag.rel{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.pool{background:var(--accent-soft);color:var(--accent)}
.wt{color:var(--wt)}
.rft{color:var(--rf)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:18px}
.panel{grid-column:span 12;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel.half{grid-column:span 6}
.panel.third{grid-column:span 4}
.panel.two3{grid-column:span 8}
@media (max-width:960px){.panel.half,.panel.third,.panel.two3{grid-column:span 12}}
@media (min-width:1500px){.panel.wide-half{grid-column:span 6}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--muted);font-size:.9rem;max-width:75ch}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
th small{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-family:var(--f-body)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.grp td{background:var(--navy-soft);color:var(--navy);border-bottom:none;padding:8px 10px}
tr.grp td b{font-family:var(--f-display);font-stretch:85%;font-size:1rem}
tr.grp .gsum{font-variant-numeric:tabular-nums;font-weight:600;margin-left:10px}
tr.feeder td:first-child{padding-left:26px}
tr.self td{background:var(--accent-soft)}
.pname{font-weight:700}
.pname small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.pod-cell{white-space:nowrap}
.pod-cell .pair{display:flex;gap:4px;justify-content:flex-end}
.pod-cell .val{font-variant-numeric:tabular-nums}
.pod-cell .sub{display:block;font-size:.74rem;color:var(--muted);margin-top:3px}
.na{color:var(--line);text-align:center}
.util{min-width:130px}
.util .u{display:grid;grid-template-columns:2.4em 1fr 2.8em;gap:6px;align-items:center;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}

.form{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field.rfx label{color:var(--rf)}
.hint{font-size:.88rem;padding:8px 12px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--navy);color:var(--ink);margin:0}
.hint.ts{border-left-color:var(--accent)}
.hint.ok{border-left-color:var(--ok)}
.hint.heavy{border-left-color:var(--wt)}

.mine{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.mcard.rfcard{background:var(--rf-soft);border-color:transparent}
.mcard .bigs{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.mcard .big{font-family:var(--f-display);font-stretch:85%;font-size:1.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mcard .big small{font-size:.82rem;font-weight:600;color:var(--muted)}
.mcard .big.wt small{color:var(--wt)}
.mcard .big.rft small{color:var(--rf)}
.mcard .ln{font-size:.8rem;color:var(--muted)}

.dis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.dcard{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.split .d{background:var(--ok)} .split .t{background:var(--accent)}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;font-size:.88rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:none}
.drow .from{grid-column:2 / 4;font-size:.75rem;color:var(--muted)}
.drow .q{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.drow .q small{display:block;color:var(--wt);font-size:.75rem}
.drow .q small.rft{color:var(--rf)}

.conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.conn-col{display:flex;flex-direction:column;gap:10px}
.conn-hub{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.conn-hub h3{display:flex;justify-content:space-between;gap:8px}
.conn-hub ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.conn-hub li{display:flex;justify-content:space-between;gap:10px}
.svc{font-family:var(--f-mono);font-size:.72rem;font-weight:600;background:var(--navy-soft);color:var(--navy);padding:1px 6px;border-radius:4px;white-space:nowrap}
.svc.land{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.pool-row{display:flex;flex-direction:column;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft)}
.pool-row .what b{font-family:var(--f-display);font-stretch:85%;font-size:1.1rem}
.empty{color:var(--muted);font-size:.9rem;padding:10px 0;margin:0}
.log{list-style:none;margin:0;padding:0;font-size:.85rem;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;gap:10px}
.log time{color:var(--muted);font-family:var(--f-mono);font-size:.75rem;white-space:nowrap;padding-top:2px}
.note{font-size:.82rem;color:var(--muted);margin:0}

/* frozen first column in every table */
.tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:inset -1px 0 0 var(--line);min-width:200px}
.tbl-wrap tr.self td:first-child{background:var(--accent-soft)}
.tbl-wrap tr.grp td:first-child{position:static;background:var(--navy-soft);box-shadow:none}
.tbl-wrap tr.sec td:first-child{position:static;background:var(--surface-2);box-shadow:none}
tr.grp .gl{position:sticky;left:10px;display:inline-block;white-space:normal;max-width:min(1100px,82vw)}

<script>
/* ================= PIL logo =================
   Traced from the logo on pilship.com (170×53). The blue flag is three slanted bands cut by two wavy lines;
   each wavy edge follows the same sine wave, shifted down and slightly left to match the slant. */
(function drawLogo(){
  const wave=(x,o)=>o+3.2-2.95*Math.sin(2*Math.PI*(x+0.234*o-5.5)/62);
  const xl=y=>8.4-0.17*y, xr=y=>65.6-0.175*y;
  const end=(o,side)=>{ let x=side<0?xl(wave(10,o)):xr(wave(50,o)); for(let i=0;i<20;i++) x=side<0?xl(wave(x,o)):xr(wave(x,o)); return [x,wave(x,o)]; };
  const edge=o=>{ const p=[]; for(let x=-2;x<=68;x+=1){ const y=wave(x,o); if(x>xl(y)&&x<xr(y)) p.push([x,y]); } return p; };
  const band=(t,b)=>'M'+[end(t,-1),...edge(t),end(t,1),end(b,1),...edge(b).reverse(),end(b,-1)].map(p=>p.map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';
  const pil='M72 4H104C109.5 4 112.6 8 112.3 14L111.6 24C110.9 33 104.5 38.8 95 39H81.2L79.6 50H64.2ZM85 17H95C96.8 17 96.8 20 96.3 22.2C95.8 24.5 94.6 25.7 92.6 25.7H83.4Z'
          + 'M118 4H134L126.6 50H110.4ZM139 4H154.2L149.3 37H170.1L168.2 50H131.2Z';
  document.getElementById('pil-logo').innerHTML =
    `<path fill="#0072BC" d="${band(0,13)+band(17.3,30)+band(34.3,47)}"/><path fill="#ED1C24" fill-rule="evenodd" d="${pil}"/>`;
})();

/* ================= Master data (sample) ================= */
// Slot dimensions allocated per POL→POD. Reefer is handled separately: plugs are a vessel BSA, optionally released per port.
const DIMS = [{k:'teu',u:'TEU',label:'TEU'},{k:'mt',u:'MT',label:'Weight'}];

const PORTS = {
  CNSHA:'Shanghai', CNNGB:'Ningbo', CNSHK:'Shekou', SGSIN:'Singapore', MYWSP:'Port Klang (Westport)',
  INNSA:'Nhava Sheva', INMUN:'Mundra', PKKHI:'Karachi',
  YRD:'YRD ports', CNZJG:'Zhangjiagang', CNNKG:'Nanjing', CNWHI:'Wuhu', CNWNZ:'Wenzhou', CNTAO:'Qingdao',
  IDJKT:'Jakarta', IDSUB:'Surabaya', VNSGN:'Ho Chi Minh', THLCH:'Laem Chabang', IDBLW:'Belawan', MYPEN:'Penang',
  INTKD:'ICD Tughlakabad', INLDH:'ICD Ludhiana', AEJEA:'Jebel Ali', KRPUS:'Busan'
};
// Full round voyage. SGSIN and MYWSP are called on both bounds.
const ROT = [
  {port:'CNSHA',eta:'2026-10-28'},{port:'CNNGB',eta:'2026-10-29'},{port:'CNSHK',eta:'2026-11-01'},
  {port:'SGSIN',eta:'2026-11-06'},{port:'MYWSP',eta:'2026-11-07'},
  {port:'INNSA',eta:'2026-11-14'},{port:'INMUN',eta:'2026-11-16'},{port:'PKKHI',eta:'2026-11-18'},

const nsRate = (b,p) => { const rows=(history()[b+'|'+aKey(b,p)]||[]).slice(-13), bk=rows.reduce((s,x)=>s+x.bt,0), ld=rows.reduce((s,x)=>s+x.lt,0); return bk?Math.max(0,1-ld/bk):0; };

/* ---- #2 Yield. Sample contribution per TEU in USD, by load call and POD. ---- */
const CM = {
  WB:{ CNSHA:{SGSIN:180,MYWSP:170,INNSA:450,INMUN:420,PKKHI:520}, CNNGB:{SGSIN:170,MYWSP:160,INNSA:440,INMUN:410,PKKHI:510},

const FEED_COST = f => f ? (f.svc?120:90) : 0;   // via another service (T/S handling) or barge / rail / feeder

const cmRate = (b,p,d) => ((CM[b][loadCall(b,p)]||{})[d]||0) - FEED_COST(feedInfo(b,p));
const cmBk = x => (cmRate(x.b,x.port,x.pod) - (x.fpd!==x.pod?TS_COST:0)) * x.teu;

const usd = v => 'USD '+(Math.abs(v)>=1e6?(v/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?(v/1e3).toFixed(1)+'k':Math.round(v));
// Best other use of the same legs: a POL→POD on this bound with demand beyond allocation (waiting requests or forecast over).
function bestAlt(b,p,d,downstreamOnly){
  const a0=lci(b,p), a1=ci(b,d); let best=null;
  origins(b).forEach(q=>podsFor(b,q).forEach(e=>{
    if(q===p&&e===d) return;
    const q0=lci(b,q), q1=ci(b,e); if(q1<=a0||q0>=a1) return;
    if(downstreamOnly && q0<a0) return;
    const want=vadd(vsum(reqs(b,q,'pending').filter(r=>r.pod===e).map(pick)), hasFc(b,q,e)?vpos(vsub(fc(b,q,e),eff(b,q,e))):Z());
    if(!want.teu) return;
    const r=cmRate(b,q,e); if(!best||r>best.rate) best={q,e,rate:r,want};
  }));
  return best;
}
function yieldNote(b,p,d,teu){
  const r=cmRate(b,p,d), alt=bestAlt(b,p,d,false);
  const head=`Contribution here <b>USD ${n0(r)}/TEU</b>${teu?`, about <b>${usd(r*teu)}</b> for ${n0(teu)} TEU`:''}.`;
  if(!alt) return `<span class="yn ok">${head} No other port with waiting demand shares these legs.</span>`;
  return alt.rate>r+20
    ? `<span class="yn warn">${head} Better use of these legs: ${nm(alt.q)} → ${sn(alt.e)} pays USD ${n0(alt.rate)}/TEU and has ${n0(alt.want.teu)} TEU waiting.</span>`
    : `<span class="yn ok">${head} Best use of these legs. Next best: ${nm(alt.q)} → ${sn(alt.e)} at USD ${n0(alt.rate)}/TEU.</span>`;
}
function relNote(b,p,d){
  const r=cmRate(b,p,d), alt=bestAlt(b,p,d,true);
  if(!alt) return `<span class="yn">These slots earn USD ${n0(r)}/TEU here. No port at this call or later has waiting demand on these legs yet.</span>`;
  return alt.rate>=r
    ? `<span class="yn ok">Good release: ${nm(alt.q)} → ${sn(alt.e)} pays USD ${n0(alt.rate)}/TEU (vs ${n0(r)} here) and has ${n0(alt.want.teu)} TEU waiting.</span>`
    : `<span class="yn warn">These slots earn USD ${n0(r)}/TEU here. The best taker, ${nm(alt.q)} → ${sn(alt.e)}, pays only USD ${n0(alt.rate)}/TEU.</span>`;
}
/* ---- Forecast (port agent) and additional loading requests (HQ approves) ---- */
const fc = (b,p,d) => pick(S.forecast[K(b,aKey(b,p),d)]||{});
const hasFc = (b,p,d) => !!S.forecast[K(b,aKey(b,p),d)];
const fcP = (b,p) => vsum(BD(b).pods.map(d=>fc(b,p,d)));
const fcOver = (b,p) => vsum(BD(b).pods.map(d=>hasFc(b,p,d)?vpos(vsub(fc(b,p,d),eff(b,p,d))):Z()));

/* ---- Reefer ---- */
const rfA = (b,p) => S.rfAlloc[K(b,aKey(b,p))];                       // undefined = no port RF BSA, shares vessel plugs

// Plugs on the leg sailing out of global call i: booked reefers on board + unused port RF BSA (held until the bound's last POD).
function rfLeg(i){
  let booked=0, rteu=0, held=0;
  Object.keys(BOUNDS).forEach(b=>{
    S.bookings.filter(x=>x.b===b).forEach(x=>{ if(lci(b,x.port)<=i && ci(b,x.pod)>i){ booked+=x.rf||0; rteu+=x.rfTeu||0; } });

      if(lci(b,p)<=i && lastPod(b)>i) held+=Math.max(0,S.rfAlloc[k]-rfUsed(b,p)); });
  });

}
function rfRoom(b,p,d){ let m=Infinity; for(let i=lci(b,p);i<ci(b,d);i++){ const l=rfLeg(i); m=Math.min(m,VESSEL.plugs-l.booked-l.held); } return m; }

// Box counts. A booking's TEU includes slots lost around out-of-gauge units; bookings without a split use the bound's usual 40' share.
function eqOf(x){

  const box=Math.max(0,x.teu-(x.lost||0)), u40=Math.floor(box*(x.b==='WB'?0.62:0.42)/2), ehc=Math.round(u40*0.5);
  return {e20:box-2*u40, e40:u40-ehc, ehc};
}
const eqSum = list => list.reduce((s,x)=>{ const q=eqOf(x); s.e20+=q.e20; s.e40+=q.e40; s.ehc+=q.ehc; s.dg+=x.dg||0; s.oog+=x.oog||0; s.lost+=x.lost||0;

// DG and OOG units on board the leg sailing out of global call i, both bounds counted.
function spLeg(i){ let dg=0,oog=0; Object.keys(BOUNDS).forEach(b=>S.bookings.filter(x=>x.b===b).forEach(x=>{ if(lci(b,x.port)<=i && ci(b,x.pod)>i){ dg+=x.dg||0; oog+=x.oog||0; } })); return {dg,oog}; }
function spRoom(b,p,d){ const r={dg:Infinity,oog:Infinity}; for(let i=lci(b,p);i<ci(b,d);i++){ const l=spLeg(i); r.dg=Math.min(r.dg,VESSEL.dgCap-l.dg); r.oog=Math.min(r.oog,VESSEL.oogCap-l.oog); } return r; }
const dgBanned = (b,p,d,c) => [loadCall(b,p),d].filter(port=>((DG_RULES[port]||{}).ban||[]).includes(c));
const spChips = x => [x.dg?`<span class="chip dgc">DG Cl.${x.dgc} × ${x.dg}</span>`:'', x.oog?`<span class="chip oogc">OOG × ${x.oog} · ${x.lost} TEU lost</span>`:''].filter(Boolean).join(' ');
const rfPeak = () => Math.max(...ROT.slice(0,-1).map((_,i)=>{const l=rfLeg(i); return l.booked+l.held;}));

// What is on board on the leg sailing out of global call i — both bounds counted.
function legs(){
  const out=[];
  for(let i=0;i<ROT.length-1;i++){
    let a=Z(), u=Z(), parts={};
    Object.keys(BOUNDS).forEach(b=>origins(b).forEach(p=>BD(b).pods.forEach(d=>{
      if(lci(b,p)<=i && ci(b,d)>i){ a=vadd(a,eff(b,p,d)); u=vadd(u,used(b,p,d)); parts[b]=true; }
    })));

}
function legRoom(b,p,d){

  for(let i=lci(b,p);i<ci(b,d);i++) DIMS.forEach(x=>room[x.k]=Math.min(room[x.k],VESSEL.cap[x.k]-L[i].alloc[x.k]));

}
function status(b,p){

  const obk=vsum(BD(b).pods.map(d=>vpos(vsub(used(b,p,d),eff(b,p,d)))));

  }
  const rfv=cols.map(c=>withVoy(c.id,()=>sumf(origins(b),p=>rfUsed(b,p))));
  body+=`<tr><td><span class="pname">Reefer plugs booked</span></td>${rfv.map(v=>`<td class="num rft">${v||'<span class="muted">—</span>'}</td>`).join('')}${nv.length?`<td class="num rft">${rfv.slice(1).reduce((a,c)=>a+c,0)}</td>`:''}</tr>`;
  body+=`<tr class="sec"><td colspan="${span}">Via ports and transhipment</td></tr>`;
  hubsOf(b).forEach(h=>{
    if(BD(b).pols.includes(h) && (BD(b).feeders[h]||[]).length) body+=row(`Loading via ${sn(h)}`, BD(b).feeders[h].map(f=>f.port.slice(2)).join(', '), ()=>flows(b,h).join);
    if(isPod(b,h) && (BD(b).onward[h]||[]).length) body+=row(`T/S at ${sn(h)}`, 'onward to '+BD(b).onward[h].map(f=>f.port.slice(2)).join(', '), ()=>flows(b,h).ts);
  });
  return `<section class="panel" id="pipeline" data-nav="Next vessels"><div class="ph"><div><h2>Next vessels</h2>
    <p>Booked cargo on this voyage and the next ${nv.length||'none'}. Plan hub handling, connecting services and rollover ahead of time.</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>${BD(b).label}</th>${cols.map((c,i)=>`<th class="num ${i===0?'cur':''}">${c.vessel}<small>${c.id}${tag}${i===0?' · this voyage':` · ETA ${fmt(addDays(ROT[BD(b).calls[0]].eta,c.wk*7))}`}</small></th>`).join('')}${nv.length?`<th class="num">Next ${nv.length} total</th>`:''}</tr></thead><tbody>${body}</tbody></table></div></section>`;
}

/* ================= Views ================= */
function roleOptions(){
  let h=`<option value="HQ">HQ Trade</option>`;
  const seen=new Set();
  Object.entries(BOUNDS).forEach(([b,cfg])=>{
    h+=`<optgroup label="${cfg.label} loading">`;
    cfg.pols.forEach(pol=>{
      if(!seen.has(pol)){ seen.add(pol); h+=`<option value="${pol}">Agent · ${sn(pol)}</option>`; }
      (BD(b).feeders[pol]||[]).map(f=>f.port).filter(p=>origins(b).includes(aKey(b,p))&&!seen.has(p)).forEach(f=>{ seen.add(f); h+=`<option value="${f}">Agent · ${nm(f)} (via ${sn(pol)})</option>`; });
    });
    h+='</optgroup>';
  });
  return h;
}

function voyageHead(){
  const o=origins(B), tot=vsum(o.map(p=>effP(B,p))), bk=vsum(o.map(p=>usedP(B,p))), pool=vsum(o.map(p=>poolFrom(B,p))), fct=vsum(o.map(p=>fcP(B,p)));
  const rfu=sumf(o,p=>rfUsed(B,p)), rft=sumf(o,p=>rfTeuUsed(B,p)), peak=rfPeak();
  const k=(lbl,v,col)=>`<div class="kpi"><span>${lbl}</span><b style="color:${col}">${n0(v.teu)} TEU<small style="color:var(--wt)">${n0(v.mt)} MT</small></b></div>`;
  document.getElementById('kpis').innerHTML =
    k('Capacity',VESSEL.cap,'var(--ink)') + k('Allocated',tot,'var(--navy)') + k('Forecast',fct,'var(--gold)') + k('Booked',bk,'var(--ok)') +
    (role==='HQ'?(()=>{ const c=sumf(o,p=>cmP(B,p)); return `<div class="kpi"><span title="Contribution margin booked">CM booked</span><b style="color:var(--ok)">${usd(c)}<small style="color:var(--muted)">${n0(c/Math.max(1,bk.teu))}/TEU</small></b></div>`; })():'') +
    k('Pool',pool,'var(--accent)') +
    `<div class="kpi"><span>Reefer plugs</span><b style="color:var(--rf)">${n0(rfu)}<small style="color:var(--muted)">${n0(rft)} RF TEU · peak ${peak}/${VESSEL.plugs}</small></b></div>`;
  return `<section class="voyage">
    <div><div class="eyebrow">${VESSEL.service} · ${BD(B).label} ${BD(B).pols.map(p=>p.slice(2)).join('·')} → ${BD(B).pods.map(p=>p.slice(2)).join('·')}</div>
      <h2>${curVoy().vessel} · ${vtag()}<span class="sample">Sample data · today ${fmt(TODAY)}</span></h2></div>
    </section>`;
}

function routeStrip(){
  const L=legs(); const myIdx = role==='HQ'?-1:(loadsIn(B,role)?lci(B,role):(isPod(B,role)?ci(B,role):-1));
  const inB=new Set(BD(B).calls);
  let h=`<div class="route" aria-label="Port rotation" data-nav="Rotation"><div class="route-key"><span><i style="background:var(--navy)"></i>TEU</span><span><i style="background:var(--wt)"></i>Tonnage</span><span><i style="background:var(--rf)"></i>Reefer plugs</span><span>Solid = booked, light = allocated or held. Legs count cargo of both bounds.</span></div><ol class="calls">`;
  ROT.forEach((c,i)=>{
    const p=c.port, isL = inB.has(i) && BD(B).pols.includes(p) && ci(B,p)===i, isD = inB.has(i) && BD(B).pods.includes(p) && ci(B,p)===i;
    const me = i===myIdx ? ' me':'';
    let disLine='';
    if(isD){
      const bs=S.bookings.filter(x=>x.b===B&&x.pod===p), t=vsum(bs.map(pick)), ts=vsum(bs.filter(x=>x.fpd!==p).map(pick));
      disLine=`<span class="ln ${isL?'dl':''}">Discharge <b>${n0(t.teu)}</b> TEU · <b>${n0(t.mt)}</b> MT</span>
        <span class="ln">${n0(t.teu-ts.teu)} direct · ${n0(ts.teu)} T/S TEU</span>`;
    }
    if(isL){
      const g=groupPorts(B,p), e=vsum(g.map(x=>effP(B,x))), u=vsum(g.map(x=>usedP(B,x)));
      const fd=g.filter(x=>x!==p), rfu=sumf(g,x=>rfUsed(B,x)), rft=sumf(g,x=>rfTeuUsed(B,x));
      h+=`<li class="call load${isD?' dis':''}${me}${omitted(i)?' omit':''}">        <span class="nm">${sn(p)} <code class="muted">${p}</code></span>
        <span class="ln">ETA ${fmt(E(i))} · cut-off ${cutoff(E(i))}</span>
        ${meter(u.teu,e.teu)}<span class="ln"><b>${n0(u.teu)}</b> / ${n0(e.teu)} TEU</span>
        ${meter(u.mt,e.mt,'mtm')}<span class="ln"><b>${n0(u.mt)}</b> / ${n0(e.mt)} MT</span>
        ${rfu?`<span class="ln rfl">RF ${rfu} plugs · ${rft} TEU</span>`:''}
        ${fd.length?`<span class="fd">+ ${fd.map(x=>isGroup(B,x)?x:x.slice(2)).join(', ')} via ${p.slice(2)}</span>`:''}
        ${disLine}</li>`;
    } else if(isD){
      h+=`<li class="call dis${me}${omitted(i)?' omit':''}">
        <span class="nm">${sn(p)} <code class="muted">${p}</code></span>
        <span class="ln">ETA ${fmt(E(i))}</span>${disLine}</li>`;
    } else {
      const other = Object.keys(BOUNDS).find(b=>b!==B);
      h+=`<li class="call other"><span class="eyebrow">${c.next?'Next voyage':BD(other).label}</span>
        <span class="nm">${sn(p)} <code class="muted">${p}</code></span>
        <span class="ln">ETA ${fmt(E(i))}</span></li>`;
    }
    if(i<L.length){
      const l=L[i], bars=DIMS.map(d=>{const over=l.alloc[d.k]>VESSEL.cap[d.k];
        return `<span class="legbar ${d.k==='mt'?'mtb':''} ${over?'over':''}"><i class="b" style="width:${Math.min(100,l.booked[d.k]/VESSEL.cap[d.k]*100)}%"></i><i class="a" style="width:${Math.max(0,Math.min(100,(l.alloc[d.k]-l.booked[d.k])/VESSEL.cap[d.k]*100))}%"></i></span>`;}).join('');
      const r=l.rf, rOver=r.booked+r.held>VESSEL.plugs;
      const rbar=`<span class="legbar rfb ${rOver?'over':''}"><i class="b" style="width:${Math.min(100,r.booked/VESSEL.plugs*100)}%"></i><i class="a" style="width:${Math.max(0,Math.min(100,r.held/VESSEL.plugs*100))}%"></i></span>`;
      const spare=vsub(VESSEL.cap,l.alloc), over=DIMS.some(d=>spare[d.k]<0);
      h+=`<li class="leg" aria-label="Leg ${ROT[i].port} to ${ROT[i+1].port}"><span class="arrow">→</span>${bars}${rbar}
        <span class="lb ${over?'over':''}">${over?'<b>Over</b>':'Spare'}<br><b>${n0(spare.teu)}</b> TEU<br><b>${n0(spare.mt)}</b> MT</span>
        <span class="lb rfl ${rOver?'over':''}">RF <b>${r.booked+r.held}</b>/${VESSEL.plugs}</span>
        ${l.bounds.length>1?'<span class="lb">WB + EB</span>':''}</li>`;
    }
  });
  return h+'</ol></div>';
}

function connections(){
  const b=B;
  const joins = BD(b).pols.map(pol=>{
    const fs=BD(b).feeders[pol]||[];
    return `<div class="conn-hub"><h3><span>${nm(pol)} <code class="muted">${pol}</code></span><span class="eyebrow">ETA ${fmt(E(ci(b,pol)))}</span></h3>
      ${fs.length?`<ul>${fs.map(f=>{ const c=connInfo(b,pol,f,'in'), t=origins(b).includes(f.port)?usedP(b,f.port).teu:0;
        return `<li><span>${nm(f.port)} <code class="muted">${f.port}</code><small class="conn-d">${c.date?`Arrives ${fmt(c.date)}`:''}${t?`${c.date?' · ':''}${n0(t)} TEU booked`:''}</small></span><span class="acts">${linkLabel(f)}<span class="chip ${c.cls}">${c.txt}</span></span></li>`; }).join('')}</ul>`:'<p class="note">Local cargo only.</p>'}</div>`;
  }).join('');
  const leaves = BD(b).pods.map(pod=>{
    const os=BD(b).onward[pod]||[];
    return `<div class="conn-hub"><h3><span>${nm(pod)} <code class="muted">${pod}</code></span><span class="eyebrow">ETA ${fmt(E(ci(b,pod)))}</span></h3>
      ${os.length?`<ul>${os.map(f=>{ const c=connInfo(b,pod,f,'out'), t=sumf(S.bookings.filter(x=>x.b===b&&x.pod===pod&&x.fpd===f.port),x=>x.teu);
        return `<li><span>→ ${nm(f.port)} <code class="muted">${f.port}</code><small class="conn-d">${c.date?`Sails ${fmt(c.date)}`:''}${t?`${c.date?' · ':''}${n0(t)} TEU booked`:''}</small></span><span class="acts">${linkLabel(f)}<span class="chip ${c.cls}">${c.txt}</span></span></li>`; }).join('')}</ul>`:'<p class="note">Direct discharge only.</p>'}</div>`;
  }).join('');
  return `<section class="panel" data-nav="Connections"><div class="ph"><div><h2>${BD(b).label} connections</h2>
    <p>Ports without a call on this bound. Cargo loading via a vessel call is grouped under that call. Service codes show the connecting service; grey tags are barge, rail or feeder. Connection days use the weekly schedule of each connecting service (sample).</p></div>
    ${(()=>{ const risky=[]; BD(b).pols.forEach(pol=>(BD(b).feeders[pol]||[]).forEach(f=>{ const c=connInfo(b,pol,f,'in'); if(atRisk(c)&&origins(b).includes(f.port)&&usedP(b,f.port).teu) risky.push(f.port); }));
      BD(b).pods.forEach(pod=>(BD(b).onward[pod]||[]).forEach(f=>{ const c=connInfo(b,pod,f,'out'); if(atRisk(c)&&S.bookings.some(x=>x.b===b&&x.pod===pod&&x.fpd===f.port)) risky.push(f.port); }));
      return `<span class="chip ${risky.length?'warnc':'okc'}">${risky.length?`${risky.length} connection${risky.length>1?'s':''} with cargo at risk`:'No connection at risk'}</span>`; })()}</div>
    <div class="conn"><div class="conn-col"><span class="eyebrow">Loading via</span>${joins}</div><div class="conn-col"><span class="eyebrow">Onward from port of discharge</span>${leaves}</div></div></section>`;
}

// Each cell is a small grid: TEU and MT down, Allocation / Forecast / Booked across.
function miniGrid(allocCell, f, hasF, u, e){
  return `<table class="mini"><thead><tr><th></th><th>Allocation</th><th>Forecast</th><th>Booked</th></tr></thead><tbody>${DIMS.map(x=>`<tr><th>${x.u}</th>
    <td>${allocCell(x)}</td>
    <td class="${hasF&&f[x.k]>e[x.k]?'fo':''}">${hasF?n0(f[x.k]):'—'}</td>
    <td class="${e[x.k]&&u[x.k]>e[x.k]?'ov':e[x.k]&&u[x.k]>=e[x.k]?'fullc':''}">${n0(u[x.k])}</td></tr>`).join('')}</tbody></table>`;
}
function portRow(b,p,opts){
  const {editable=false, actions=true} = opts||{};
  const fi=feedInfo(b,p), st=status(b,p);
  const cells = BD(b).pods.map(d=>{
    if(!podOK(b,p,d)) return `<td class="na" title="Not after this port in the rotation">·</td>`;
    const bs=base(b,p,d), e=eff(b,p,d), u=used(b,p,d), r=rel(b,p,d), c=claimedIn(b,p,d);
    if(!editable && !vany(bs) && !vany(c)) return `<td class="num muted">—</td>`;
    const allocCell = x => editable
      ? `<input type="number" min="0" step="1" class="${x.k}" id="al-${b}-${p}-${d}-${x.k}" data-alloc="${b}|${p}|${d}|${x.k}" value="${bs[x.k]}" aria-label="${nm(p)} to ${nm(d)} allocation ${x.u}">${e[x.k]!==bs[x.k]?`<small class="rev" title="Revised allocation">rev ${n0(e[x.k])}</small>`:''}`
      : `<b>${n0(e[x.k])}</b>`;
    const pr=vsum(reqs(b,p,'pending').filter(q=>q.pod===d).map(pick));
    // Detail that changes the revised allocation goes in the cell's tooltip; loaded stays visible.
    const xa=extraIn(b,p,d), l=loadedOf(b,p,d);
    const tip=[vany(r)?`Released ${tot(r)}`:'', vany(c)?`Taken from pool ${tot(c)}`:'', vany(xa)?`Approved extra ${tot(xa)}`:'', vany(pr)?`Requested ${tot(pr)}`:''].filter(Boolean).join(' · ');
    const ov=S.ovr&&S.ovr[K(b,aKey(b,p),d)];
    const marks=[ov?'<span class="mk ovr" title="Changed from template on this vessel" aria-hidden="true">✎</span>':'', vany(r)?'<span class="mk rel" aria-hidden="true">−</span>':'', vany(c)||vany(xa)?'<span class="mk pool" aria-hidden="true">+</span>':''].join('');
    return `<td class="pod-cell"${tip?` title="${tip}"`:''}>${miniGrid(allocCell,fc(b,p,d),hasFc(b,p,d),u,e)}${l||marks?`<span class="sub">${marks}${l?`<span class="tag ldt">Loaded ${n0(l.teu)} / ${n0(l.mt)}</span>`:''}</span>`:''}${editable&&role==='HQ'?podActions(b,p,d):''}</td>`;
  }).join('');
  const e=effP(b,p), u=usedP(b,p), ra=rfA(b,p), ru=rfUsed(b,p), rt=rfTeuUsed(b,p);
  let act='';
  if(actions){
    if(closedP(b,p)) act = role==='HQ' ? `<button type="button" data-reopen="${p}">Reopen</button>` : '';
    else { const un=vpos(vsub(e,u)); act = armed===p
      ? `<div class="acts">${reasonSel('rs-port-'+p,'release')}<button type="button" class="danger armed" data-release="${p}">Release ${n0(un.teu)} TEU / ${n0(un.mt)} MT</button><button type="button" class="ghost" data-disarm>Cancel</button></div>`
      : `<button type="button" class="danger" data-arm="${p}" ${vany(un)||(ra>ru)?'':'disabled'}>Release unused</button>`; }
  }
  return `<tr class="${fi?'feeder':''} ${p===role?'self':''}">
    <td><span class="pname">${fi?'↳ ':''}${nm(p)} <code class="muted">${p}</code><small>${isGroup(b,p)?`Shared allocation · ${membersOf(b,p).map(nm).join(', ')} · via ${sn(fi.hub)}`:fi?`Loading via ${sn(fi.hub)} · ${fi.svc?fi.svc+' service':fi.land}`:'Vessel call · local cargo'}</small></span></td>
    ${cells}
    ${(()=>{ const o=baseP(b,p), F=fcP(b,p), L=loadedP(b,p);
      const ac=x=>`<b>${n0(e[x.k])}</b>${o[x.k]!==e[x.k]?`<small class="rev" title="Original allocation">orig ${n0(o[x.k])}</small>`:''}`;
      return `<td class="pod-cell tot-cell">${miniGrid(ac,F,vany(F),u,e)}<span class="sub">${fcLocked(b,p)?'<span class="tag rel">Forecast locked</span> ':''}${L?`<span class="tag ldt">Loaded ${n0(L.teu)} / ${n0(L.mt)}</span>`:''}</span></td>`; })()}
    <td class="st-cell"><span class="chip ${st.cls}">${st.txt}</span>
      ${role==='HQ'?(()=>{ const c=cmP(b,p); return c?`<small class="muted" title="Contribution margin booked">CM ${usd(c)} · ${n0(c/Math.max(1,u.teu))}/TEU</small>`:''; })():''}
      ${ru||ra!==undefined?`<small class="rft" title="Reefer plugs used / port reefer BSA">RF ${ru}${ra!==undefined?` / ${ra}`:''} plugs · ${rt} TEU</small>`:''}
      ${actions&&act?`<div class="st-act">${act}</div>`:''}</td></tr>`;
}

function board(b, filter, opts){
  const actions = opts.actions!==false;
  const cols = BD(b).pods.length+3;
  let h=`<div class="tbl-wrap scrolly"><table class="board"><thead><tr><th>Port of load</th>${BD(b).pods.map(d=>`<th>→ ${sn(d)}</th>`).join('')}<th>Total</th><th>Status</th></tr></thead><tbody>`;
  BD(b).pols.forEach(pol=>{
    const g=groupPorts(b,pol).filter(filter); if(!g.length) return;
    const all=groupPorts(b,pol), e=vsum(all.map(x=>effP(b,x))), u=vsum(all.map(x=>usedP(b,x)));
    // Ports loading via this call fold under it; open on request, or when the viewer / an open review box is inside.
    const via=all.filter(x=>x!==pol), key=b+'|'+pol;
    const open = expanded.has(key) || (role!=='HQ' && via.includes(aKey(b,role))) || via.some(x=>editCell&&editCell.startsWith(b+'|'+x+'|'));
    const nVia = via.reduce((n,x)=>n+(isGroup(b,x)?membersOf(b,x).length:1),0);
    const pq=vsum(via.flatMap(x=>reqs(b,x,'pending')).map(pick)), fo=via.filter(x=>vany(fcOver(b,x))).length;
    const badges=open?'':[vany(pq)?`<span class="chip warnc">${n0(pq.teu)} TEU awaiting HQ</span>`:'', fo?`<span class="chip warnc">${fo} forecast over</span>`:''].join(' ');
    const tog=via.length?`<button type="button" class="tog" data-tog="${key}" aria-expanded="${open}">${open?'▾ Hide':'▸ Show'} ${nVia} port${nVia>1?'s':''} loading via ${sn(pol)}</button>`:'';
    h+=`<tr class="grp"><td colspan="${cols}"><span class="gl"><b>${nm(pol)}</b>${tog}${badges} <span class="gsum">· cut-off ${cutoff(E(ci(b,pol)))} · loads here ${n0(u.teu)} / ${n0(e.teu)} TEU · ${n0(u.mt)} / ${n0(e.mt)} MT</span></span></td></tr>`;
    g.filter(p=>p===pol||open).forEach(p=>{ h+=portRow(b,p,opts); if(isGroup(b,p)) h+=membersOf(b,p).map(m=>loadRow(b,m,actions)).join(''); });
  });
  return h+'</tbody></table></div>';
}
// A port inside a shared allocation: its own loading only, no allocation of its own.
function loadRow(b,m,actions){
  const own=d=>vsum(bksOwn(b,m,d).map(pick));
  const cell=u=>vany(u)?`<span class="ld">Booked <b>${n0(u.teu)}</b> TEU · ${n0(u.mt)} MT</span>`:'<span class="muted">—</span>';
  return `<tr class="loadrow ${m===role?'self':''}"><td><span class="pname">${nm(m)} <code class="muted">${m}</code><small>Loading only · books against the shared ${nm(aKey(b,m))} allocation</small></span></td>
    ${BD(b).pods.map(d=>podOK(b,m,d)?`<td class="num">${cell(own(d))}</td>`:'<td class="na">·</td>').join('')}
    <td class="num">${cell(own())}</td><td></td></tr>`;
}

function dischargePlan(b, bks, title, note, onlyPod){
  let h=`<section class="panel" data-nav="${title}"><div class="ph"><div><h2>${title}</h2><p>${note}</p></div></div><div class="dis-grid">`;
  BD(b).pods.filter(d=>!onlyPod||d===onlyPod).forEach(d=>{
    const bs=bks.filter(x=>x.pod===d), t=vsum(bs.map(pick)), trf=sumf(bs,x=>x.rf);
    const groups={}; bs.forEach(x=>{ const g=(groups[x.fpd]=groups[x.fpd]||{v:Z(),rf:0,pols:new Set()}); g.v=vadd(g.v,pick(x)); g.rf+=x.rf||0; g.pols.add(x.port); });
    const dir=groups[d]?.v||Z(), ts=vsub(t,dir);
    const rows=Object.entries(groups).sort((a,c)=>(a[0]===d?-1:c[0]===d?1:c[1].v.teu-a[1].v.teu)).map(([f,g])=>{
      const o=onwardOf(b,d,f);
      return `<div class="drow">${f===d?'<span class="chip direct">Direct</span>':'<span class="chip ts">T/S</span>'}<span>${f===d?`Discharge at ${sn(d)}`:`On to ${nm(f)} <code class="muted">${f}</code> ${o?linkLabel(o):''}`}</span><span class="q"><b>${n0(g.v.teu)} TEU</b><small>${n0(g.v.mt)} MT</small>${g.rf?`<small class="rft">${g.rf} reefer</small>`:''}</span><span class="from">From ${[...g.pols].map(sn).join(', ')}</span></div>`;
    }).join('');
    h+=`<div class="dcard"><div class="ph"><h3>${nm(d)} <code class="muted">${d}</code></h3><span class="muted">ETA ${fmt(E(ci(b,d)))}</span></div>
      <div class="split" aria-hidden="true"><i class="d" style="width:${t.teu?dir.teu/t.teu*100:0}%"></i><i class="t" style="width:${t.teu?ts.teu/t.teu*100:0}%"></i></div>
      <span class="muted" style="font-size:.85rem"><b style="color:var(--ink)">${qty(t)}</b> · ${n0(dir.teu)} direct · ${n0(ts.teu)} transhipment TEU${trf?` · <span class="rft">${trf} reefer</span>`:''}</span>
      ${rows||'<span class="empty">Nothing booked to this port yet.</span>'}</div>`;
  });
  return h+'</div></section>';
}

/* HQ decides additional loading per port of load AND port of discharge, for any amount up to the full need. */
const statusChip = r => r.status==='pending'?['warnc','Waiting for HQ']:r.status==='approved'?['okc','Approved']:r.status==='partial'?['warnc',`Part · ${n0(r.booked?.teu||0)} of ${n0(r.teu)} TEU`]:['over','Rejected'];

// Release any amount up to the unused balance for one POL→POD; the rest stays with the port.

// Small actions inside each POD cell of the HQ board: review a request, release this POD's unused balance.
function podActions(b,p,d){
  const key=K(b,p,d), pend=reqs(b,p,'pending').filter(r=>r.pod===d), un=vpos(vsub(eff(b,p,d),used(b,p,d)));
  let h='';
  if(pend.length) h+= editCell===key ? decisionEditor(b,p,d,'ap',true) : `<button type="button" class="okb sm" data-opencell="${key}">Review +${n0(vsum(pend.map(pick)).teu)} TEU</button>`;
  if(vany(un) && !closedP(b,p)) h+= armed==='rp:'+key
    ? relForm(key,un,'hq')
    : `<button type="button" class="ghost sm relb" data-arm="rp:${key}" title="Release unused balance to ${nm(d)} only">Release ${un.teu?n0(un.teu)+' TEU':n0(un.mt)+' MT'}</button>`;
  // Release shows on hover; a waiting request keeps Review visible; an open box floats over the board.
  return h?`<span class="cell-acts${pend.length?' req':''}${editCell===key||armed==='rp:'+key?' open':''}">${h}</span>`:'';
}

/* ---- Port performance over the year (HQ) ----
   Measured against ORIGINAL allocation only. Extra balance a port receives later (pool, HQ approval) raises the revised
   allocation, but loading less than that extra is never counted against the port. */
const HIST_WEEKS = 41;                               // completed 2026 voyages before the live ones (sample history)
let HIST=null, perfSel=null, perfPeriod='ytd';
function rng(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function history(){
  if(HIST) return HIST;
  const tpl=ALL.voyages[VOYAGES[0].id]; HIST={};
  Object.keys(BOUNDS).forEach((b,bi)=>{
    [...new Set(tpl.alloc.filter(a=>a.b===b).map(a=>a.port))].forEach((p,pi)=>{
      const r=rng(pi*97+bi*1013+7), al=tpl.alloc.filter(a=>a.b===b&&a.port===p);
      const bt=al.reduce((s,a)=>s+a.teu,0), bm=al.reduce((s,a)=>s+a.mt,0), mpt=bm/bt;
      const reliab=0.8+r()*0.28, ns=0.03+r()*0.12, rows=[];        // ns: this port's typical no-show rate
      for(let w=1;w<=HIST_WEEKS;w++){
        const ot=Math.max(5,Math.round(bt*(0.85+r()*0.3)/5)*5), om=Math.round(ot*mpt);
        const et = r()<0.35 ? Math.round(ot*(0.1+r()*0.4)) : 0;          // extra balance from pool / HQ approval
        let lt=Math.round(ot*(reliab+(r()-0.5)*0.25) + et*(0.3+r()*0.7));
        lt=Math.max(0,Math.min(ot+et,lt));
        const relT = (!et && lt<ot && r()<0.6) ? ot-lt : 0;            // released unused at cut-off
        const rt=ot+et-relT;
        rows.push({w, voy:String(370+w).padStart(4,'0'), ot, om, rt, rm:Math.round(rt*mpt), lt, lm:Math.round(lt*mpt*(0.9+r()*0.2)), et, relT, bt:Math.round(lt/(1-ns*(0.6+r()*0.8)))});
      }
      HIST[b+'|'+p]=rows;
    });
  });
  return HIST;
}
function perfStats(rows){
  const s={n:rows.length,O:Z(),R:Z(),L:Z(),met:Z(),xGiven:0,xUsed:0,miss:0,Bk:0};
  rows.forEach(x=>{
    s.Bk+=x.bt||x.lt;
    s.O=vadd(s.O,{teu:x.ot,mt:x.om}); s.R=vadd(s.R,{teu:x.rt,mt:x.rm}); s.L=vadd(s.L,{teu:x.lt,mt:x.lm});
    s.met=vadd(s.met,{teu:Math.min(x.lt,x.ot),mt:Math.min(x.lm,x.om)});
    s.xGiven+=Math.max(0,x.rt-x.ot); s.xUsed+=Math.max(0,x.lt-x.ot); if(x.lt<x.ot) s.miss++;
  });
  s.fulT=s.O.teu?s.met.teu/s.O.teu:0; s.fulM=s.O.mt?s.met.mt/s.O.mt:0;
  return s;
}
const pct = x => Math.round(x*100)+'%';
const grade = f => f>=.95?{c:'okc',t:'Met'}:f>=.85?{c:'warnc',t:'Watch'}:{c:'over',t:'Below'};
function spark(rows){
  const v=rows.map(x=>x.ot?Math.min(1.3,x.lt/x.ot):0), W=96, H=26, lo=.5, hi=1.3;
  const y=val=>H-2-((Math.max(lo,val)-lo)/(hi-lo))*(H-4), x=i=>2+i*(W-4)/Math.max(1,v.length-1);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="2" x2="${W-2}" y1="${y(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="2 2" stroke-width="1"/>
    <polyline fill="none" stroke="var(--navy)" stroke-width="1.6" points="${v.map((a,i)=>`${x(i).toFixed(1)},${y(a).toFixed(1)}`).join(' ')}"/>
    ${v.map((a,i)=>a<1?`<circle cx="${x(i).toFixed(1)}" cy="${y(a).toFixed(1)}" r="1.8" fill="var(--bad)"/>`:'').join('')}</svg>`;
}
function perfPanel(){
  const b=B, H=history(), n={ytd:HIST_WEEKS,q:13,m:4}[perfPeriod];
  const cut=rows=>rows.slice(-n);
  let body='';
  BD(b).pols.forEach(pol=>{
    const ports=[pol,...feedersOf(b,pol)].filter(p=>H[b+'|'+p]); if(!ports.length) return;
    const via=ports.filter(x=>x!==pol), key=b+'|'+pol, open=expanded.has(key)||via.includes(perfSel);
    body+=`<tr class="grp"><td colspan="12"><span class="gl"><b>${nm(pol)}</b>${via.length?` <button type="button" class="tog" data-tog="${key}" aria-expanded="${open}">${open?'▾ Hide':'▸ Show'} ${via.length} port${via.length>1?'s':''} loading via ${sn(pol)}</button>`:''}</span></td></tr>`;
    ports.filter(p=>p===pol||open).forEach(p=>{
      const rows=cut(H[b+'|'+p]), s=perfStats(rows), g=grade(s.fulT), fi=feedInfo(b,p);
      body+=`<tr class="${fi?'feeder':''} ${perfSel===p?'self':''}">
        <td><button type="button" class="ghost" style="color:var(--ink);padding:0;text-align:left" data-perf="${p}"><span class="pname">${fi?'↳ ':''}${nm(p)} <code class="muted">${p}</code><small>${perfSel===p?'Hide voyages':'Show voyages'}</small></span></button></td>
        <td class="num">${s.n}</td>
        <td class="num"><b>${n0(s.O.teu)}</b><br><span class="wt">${n0(s.O.mt)} MT</span></td>
        <td class="num">${n0(s.R.teu)}<br><span class="wt">${n0(s.R.mt)} MT</span></td>
        <td class="num">${n0(s.Bk)}</td>
        <td class="num">${n0(s.L.teu)}<br><span class="wt">${n0(s.L.mt)} MT</span></td>
        <td class="num">${s.Bk?pct(Math.max(0,1-s.L.teu/s.Bk)):'—'}</td>
        <td class="util"><span class="u"><span>TEU</span>${meter(s.met.teu,s.O.teu)}<span class="num">${pct(s.fulT)}</span></span><span class="u"><span>MT</span>${meter(s.met.mt,s.O.mt,'mtm')}<span class="num">${pct(s.fulM)}</span></span></td>
        <td class="num">${s.xGiven?`${n0(s.xUsed)} of ${n0(s.xGiven)}<br><small class="muted">${pct(s.xUsed/s.xGiven)} used</small>`:'<span class="muted">—</span>'}</td>
        <td class="num">${s.miss} of ${s.n}</td>
        <td>${spark(rows.slice(-13))}</td>
        <td><span class="chip ${g.c}">${g.t}</span></td></tr>`;
    });
  });
  let detail='';
  if(perfSel && H[b+'|'+perfSel]){
    const rows=cut(H[b+'|'+perfSel]).slice().reverse();
    detail=`<div id="perf-detail"><h3>${nm(perfSel)} · voyage by voyage</h3><div class="tbl-wrap"><table><thead><tr><th>Voyage</th><th class="num">Original</th><th class="num">Revised</th><th class="num">Loaded</th><th>Result</th></tr></thead><tbody>${
      rows.map(x=>{ const res = x.lt>=x.ot
          ? (x.et?`<span class="chip okc">Met original · used ${n0(x.lt-x.ot)} of ${n0(x.et)} extra</span>`:`<span class="chip okc">Met original</span>`)
          : `<span class="chip over">Short ${n0(x.ot-x.lt)} TEU</span>${x.relT?` <span class="tag rel">released ${n0(x.relT)}</span>`:''}`;
        return `<tr><td><span class="pname">${x.voy}${b==='WB'?'W':'E'}<small>2026 week ${x.w}</small></span></td><td class="num">${n0(x.ot)}<br><span class="wt">${n0(x.om)} MT</span></td><td class="num">${n0(x.rt)}<br><span class="wt">${n0(x.rm)} MT</span></td><td class="num"><b>${n0(x.lt)}</b><br><span class="wt">${n0(x.lm)} MT</span></td><td>${res}</td></tr>`; }).join('')
    }</tbody></table></div></div>`;
  }
  return `<section class="panel" data-nav="Port performance"><div class="ph"><div><h2>Port performance · ${BD(b).label} 2026</h2>
    <p>Loaded against <b>original</b> allocation, ${HIST_WEEKS} completed voyages so far this year. Extra balance a port receives later raises its revised allocation but never counts against it. Example: original 100, given 50 more from the pool, loaded 140. That is 100% of original, with 40 of the 50 extra used; the unused 10 is not a shortfall.</p></div>
    <div class="field"><label for="perf-period">Period</label><select id="perf-period"><option value="ytd" ${perfPeriod==='ytd'?'selected':''}>Year to date</option><option value="q" ${perfPeriod==='q'?'selected':''}>Last 13 voyages</option><option value="m" ${perfPeriod==='m'?'selected':''}>Last 4 voyages</option></select></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Port of load</th><th class="num">Voyages</th><th class="num">Original</th><th class="num">Revised</th><th class="num">Booked</th><th class="num">Loaded</th><th class="num">No-show<small>booked, not loaded</small></th><th>Original fulfilment<small>loaded up to original</small></th><th class="num">Extra used</th><th class="num">Missed original</th><th>Last 13 voyages<small>dash = 100% of original</small></th><th>Rating</th></tr></thead><tbody>${body}</tbody></table></div>
    ${detail}
    <p class="note">Rating: Met at 95% of original or more, Watch from 85%, Below under 85%. History is generated sample data until it is connected to actual loading.</p>
  </section>`;
}

function equipPanel(){
  const b=B, ports=[]; BD(b).pols.forEach(pol=>groupPorts(b,pol).forEach(p=>ports.push(p)));
  const tot=eqSum(S.bookings.filter(x=>x.b===b)), units=tot.e20+tot.e40+tot.ehc;
  const body=ports.map(p=>{ const s=eqSum(bksOf(b,p)), u=s.e20+s.e40+s.ehc, fi=feedInfo(b,p);
    return `<tr class="${fi?'feeder':''}"><td><span class="pname">${fi?'↳ ':''}${nm(p)} <code class="muted">${p}</code>${fi?`<small>Loading via ${sn(fi.hub)}</small>`:''}</span></td>
      <td class="num">${n0(s.e20)}</td><td class="num">${n0(s.e40)}</td><td class="num">${n0(s.ehc)}</td>
      <td class="num">${u?pct((s.e40+s.ehc)/u):'—'}</td>
      <td>${s.dg?Object.entries(s.cls).map(([c,n])=>`<span class="chip dgc">Cl.${c} × ${n}</span>`).join(' '):'<span class="muted">—</span>'}</td>
      <td class="num">${s.oog?`${s.oog} units<br><small class="muted">${s.lost} TEU lost</small>`:'<span class="muted">—</span>'}</td></tr>`; }).join('');
  const idx=BD(b).calls.slice(0,-1);
  const lim=(v,cap)=>`<b style="color:${v>cap?'var(--bad)':v>cap*0.85?'var(--warn)':'var(--ink)'}">${v}</b><small class="muted"> / ${cap}</small>`;
  const rulePorts=[...new Set([...BD(b).pols,...BD(b).pods])];
  return `<section class="panel" data-nav="Equipment & special cargo"><div class="ph"><div><h2>Equipment & special cargo</h2>
    <p>Box mix and special cargo booked on the ${BD(b).label.toLowerCase()} leg. Dangerous goods are checked against each port's accepted IMO classes and the vessel's DG limit. Out-of-gauge units count the slots they block against allocation and vessel capacity.</p></div>
    <span class="chip open">${n0(units)} boxes · ${units?pct((tot.e40+tot.ehc)/units):'0%'} 40' · DG ${tot.dg} · OOG ${tot.oog}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Port of load</th><th class="num">20'</th><th class="num">40'</th><th class="num">40'HC</th><th class="num">40' share</th><th>Dangerous goods<small>units by IMO class</small></th><th class="num">Out-of-gauge</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="tbl-wrap"><table><thead><tr><th>Leg</th>${idx.map(i=>`<th class="num">${ROT[i].port.slice(2)}→${ROT[i+1].port.slice(2)}</th>`).join('')}</tr></thead><tbody>
      <tr><td>DG units on board<small class="muted"> limit ${VESSEL.dgCap}</small></td>${idx.map(i=>`<td class="num">${lim(spLeg(i).dg,VESSEL.dgCap)}</td>`).join('')}</tr>
      <tr><td>OOG units on board<small class="muted"> limit ${VESSEL.oogCap}</small></td>${idx.map(i=>`<td class="num">${lim(spLeg(i).oog,VESSEL.oogCap)}</td>`).join('')}</tr>
    </tbody></table></div>
    <details class="fold"><summary>Port DG rules (sample)</summary><div class="tbl-wrap"><table><thead><tr><th>Port</th><th>Classes not accepted</th><th>Note</th></tr></thead><tbody>${
      rulePorts.map(p=>{ const r=DG_RULES[p]||{ban:[],note:'No restriction recorded'}; return `<tr><td><span class="pname">${nm(p)} <code class="muted">${p}</code></span></td><td>${r.ban.length?r.ban.map(c=>`<span class="chip over">Class ${c}</span>`).join(' '):'<span class="muted">None</span>'}</td><td class="muted">${esc(r.note)}</td></tr>`; }).join('')
    }</tbody></table></div><p class="note">Rules are checked at the port of load (or the call a feeder port loads via) and the port of discharge. Transit restrictions at intermediate calls are not checked yet.</p></details>
  </section>`;
}

function reeferPanel(){
  const b=B;
  const ports=[]; BD(b).pols.forEach(pol=>groupPorts(b,pol).forEach(p=>ports.push(p)));
  const L=legs(); const idx=BD(b).calls.slice(0,-1);
  const totA=sumf(Object.keys(S.rfAlloc).filter(k=>k.startsWith(b+'|')),k=>S.rfAlloc[k]);
  return `<section class="panel wide-half" data-nav="Reefer plug BSA"><div class="ph"><div><h2>Reefer plug BSA</h2>
    <p>The vessel has ${VESSEL.plugs} reefer plugs. Give a port its own plug BSA to reserve plugs for it, or leave it blank so the port books from the vessel's free plugs. Plugs count units, one per reefer container. RF TEU is shown for monitoring.</p></div>
    <span class="chip rfc">${totA} plugs released to ports on ${BD(b).label.toLowerCase()}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Port of load</th><th class="num">Port RF BSA<small>plugs, blank = vessel pool</small></th><th class="num">Plugs used</th><th class="num">RF TEU loaded</th><th>Use</th></tr></thead><tbody>${
      ports.map(p=>{ const a=rfA(b,p), u=rfUsed(b,p), t=rfTeuUsed(b,p), fi=feedInfo(b,p);
        return `<tr class="${fi?'feeder':''}"><td><span class="pname">${fi?'↳ ':''}${nm(p)} <code class="muted">${p}</code><small>${fi?`Loading via ${sn(fi.hub)}`:'Vessel call'}</small></span></td>
        <td class="num"><input type="number" min="0" step="1" id="rf-${b}-${p}" data-rf="${b}|${p}" value="${a??''}" placeholder="pool" aria-label="Reefer plug BSA for ${nm(p)}"></td>
        <td class="num rft"><b>${u}</b></td><td class="num">${t}</td>
        <td class="util">${a!==undefined?`${meter(u,a,'rfm')}<span class="muted" style="font-size:.74rem">${a-u} plugs held</span>`:`<span class="muted" style="font-size:.8rem">From vessel pool</span>`}</td></tr>`;}).join('')
    }</tbody></table></div>
    <div class="tbl-wrap"><table><thead><tr><th>Leg</th>${idx.map(i=>`<th class="num">${ROT[i].port.slice(2)}→${ROT[i+1].port.slice(2)}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Reefers on board</td>${idx.map(i=>`<td class="num">${L[i].rf.booked}</td>`).join('')}</tr>
      <tr><td>Held for ports</td>${idx.map(i=>`<td class="num">${L[i].rf.held}</td>`).join('')}</tr>
      <tr><td><b>Free plugs</b></td>${idx.map(i=>{const f=VESSEL.plugs-L[i].rf.booked-L[i].rf.held; return `<td class="num"><b style="color:${f<0?'var(--bad)':'var(--rf)'}">${f}</b></td>`;}).join('')}</tr>
      <tr><td class="muted">RF TEU on board</td>${idx.map(i=>`<td class="num muted">${L[i].rf.rteu}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="note">Legs include reefers from both bounds. A port's unused plug BSA is held until the last port of discharge on its bound, and goes back to the vessel pool when the port releases at cut-off.</p>
  </section>`;
}

function hqView(){
  const b=B;
  const opts=[]; BD(b).pols.forEach(pol=>{ opts.push(pol); feedersOf(b,pol).forEach(f=>opts.push(f)); });
  const sources = origins(b).filter(u=>vany(relP(b,u)));
  return `<div class="grid">${alerts()}${reminder()}
    <section class="panel board-panel" data-nav="Allocation board"><div class="ph"><div class="bh"><h2>${BD(b).label} allocation board · ${curVoy().vessel} ${vtag()}</h2><span class="sample">Sample · today ${fmt(TODAY)}</span>
      <span class="info" tabindex="0" title="Type allocation in TEU and MT for each port of load and discharge. Each cell shows Allocation / Forecast / Booked. Ports loading via a call fold under it; the YRD ports share one allocation. Amber forecast = above allocation, green booked = at allocation, red = over. A dot means that discharge port comes before the load port. Hover a cell to release balance; Review appears when a request is waiting.">ⓘ How to read</span>
      <span class="legend"><span class="mk pool">+</span> pool / approved <span class="mk rel">−</span> released · hover a cell for detail</span></div>

    ${tmplPanel()}

    ${heatPanel()}
    ${requestsPanel()}
    ${rulesPanel()}
    <section class="panel half" data-nav="Release allocation"><div class="ph"><div><h2>Release allocation to a port</h2><p>Pick any port on this bound. Feeder and transhipment ports group under their load call automatically.</p></div></div>
      <form class="form" id="f-alloc">
        <div class="field"><label for="na-port">Port of load</label><select id="na-port">${opts.map(p=>{const fi=feedInfo(b,p); return `<option value="${p}">${nm(p)}${fi?` (via ${fi.hub.slice(2)}${fi.svc?' · '+fi.svc:''})`:''}</option>`;}).join('')}</select></div>
        <div class="field"><label for="na-pod">Port of discharge</label><select id="na-pod"></select></div>

        <div class="field"><label for="na-mt">Tonnage (MT)</label><input id="na-mt" class="mt" type="number" min="0" step="1" value="${20*BD(b).mtPerTeu}"></div>
        <button class="primary" type="submit">Add allocation</button>
      </form>
      <p class="hint" id="na-hint"></p>
    </section>

    <section class="panel half" data-nav="Balance pool"><div class="ph"><div><h2>Balance pool</h2><p>Unused TEU and tonnage balance released at cut-off. Ports loading at the same or a later call on this bound can take it.</p></div></div>
      ${sources.length? `<div class="tbl-wrap"><table><thead><tr><th>Released by</th><th class="num">Released</th><th class="num">Available</th><th>Taken by</th></tr></thead><tbody>${
        sources.map(u=>{ const cl=S.claims.filter(c=>c.b===b&&c.from===u); const av=poolFrom(b,u); return `<tr><td class="pname">${nm(u)}</td><td class="num">${qty(relP(b,u))}</td><td class="num"><b style="color:var(--accent)">${n0(av.teu)} TEU</b><br><span class="wt">${n0(av.mt)} MT</span></td><td>${cl.map(c=>`${nm(c.port)} ${n0(c.teu)} TEU / ${n0(c.mt)} MT → ${sn(c.pod)}`).join('<br>')||'<span class="muted">—</span>'}</td></tr>`}).join('')
      }</tbody></table></div>` : '<p class="empty">No balance released on this bound yet.</p>'}
      <h3>Activity</h3>
      <ul class="log">${ALL.log.slice(-6).reverse().map(l=>`<li><time>${esc(l.t)}</time><span>${esc(l.m)}</span></li>`).join('')}</ul>

    ${loadListPanel()}

}

function inboundView(){
  const b=B, p=role;
  if(isPod(b,p)) return `<div class="grid">${alerts()}${reminder()}
    <section class="panel"><div class="ph"><div><div class="eyebrow">${BD(b).label} · you discharge here · ETA ${fmt(E(ci(b,p)))}</div><h2>${nm(p)} inbound</h2>
      <p>${nm(p)} does not load on the ${BD(b).label.toLowerCase()} leg. Below is what this voyage brings to you. Switch bound in the top bar to manage your loading.</p></div></div></section>
    ${dischargePlan(b,S.bookings.filter(x=>x.b===b),'Cargo discharging at '+nm(p),'Direct cargo for your port, plus boxes you hand over for onward transhipment.',p)}
    ${iaWeekPanel()}
    ${pipelinePanel()}</div>`;
  return `<div class="grid"><section class="panel"><h2>${nm(p)} has no ${BD(b).label.toLowerCase()} activity</h2><p class="note">Switch bound in the top bar.</p></section></div>`;
}

function rfCard(b,p){
  const a=rfA(b,p), u=rfUsed(b,p), t=rfTeuUsed(b,p);
  const far=podsFor(b,p).slice(-1)[0];
  const free = far ? Math.max(0,rfRoom(b,p,far)) : 0;
  return `<div class="mcard rfcard"><span class="eyebrow">Reefer plugs</span>
    ${a!==undefined
      ? `<div class="bigs"><span class="big rft">${Math.max(0,a-u)} <small>plugs left</small></span></div>${meter(u,a,'rfm')}
         <span class="ln">Your RF BSA ${a} plugs · ${u} used · ${t} RF TEU</span>`
      : `<div class="bigs"><span class="big rft">${free} <small>vessel plugs free</small></span></div>
         <span class="ln">No port RF BSA. You book from the vessel's free plugs, first come first served. ${u} used · ${t} RF TEU.</span>`}
  </div>`;
}

function agentView(){
  const b=B, p=role;
  if(!loadsIn(b,p)) return inboundView();
  const fi=feedInfo(b,p), myL=lci(b,p), closed=closedP(b,p);
  const myPods = BD(b).pods.filter(d=>vany(eff(b,p,d))||vany(base(b,p,d)));
  const cards = myPods.map(d=>{
    const bs=base(b,p,d), e=eff(b,p,d), u=used(b,p,d), r=rel(b,p,d), c=claimedIn(b,p,d), left=bookLeft(b,p,d);
    return `<div class="mcard"><span class="eyebrow">To ${sn(d)} · ${d}</span>
      <div class="bigs"><span class="big">${n0(Math.max(0,left.teu))} <small>TEU left</small></span><span class="big wt">${n0(Math.max(0,left.mt))} <small>MT left</small></span></div>
      ${meter(u.teu,e.teu)}${meter(u.mt,e.mt,'mtm')}
      <span class="ln">Booked ${qty(u)} of ${qty(e)}</span>
      ${aKey(b,p)!==p?`<span class="ln">Shared ${nm(aKey(b,p))} allocation with ${membersOf(b,aKey(b,p)).filter(m=>m!==p).map(nm).join(', ')}. Your port booked ${qty(vsum(bksOwn(b,p,d).map(pick)))}.</span>`:''}
      ${allowance(b,p)?`<span class="ln">You may book up to <b>${n0(capOf(b,p,d).teu)} TEU</b>: +${pct(allowance(b,p))} allowance for your port's usual no-shows.</span>`:''}
      <span class="ln">Original ${n0(bs.teu)} TEU / ${n0(bs.mt)} MT${(()=>{ const xa=extraIn(b,p,d); return vany(xa)?` · +${n0(xa.teu)}/${n0(xa.mt)} approved`:''; })()}${vany(c)?` · +${n0(c.teu)}/${n0(c.mt)} from pool`:''}${vany(r)?` · −${n0(r.teu)}/${n0(r.mt)} released`:''}</span>
      ${(()=>{ const un=vpos(vsub(e,u)), key=K(b,p,d); if(closed||!vany(un)) return '';
        return `<span class="acts">${armed==='rp:'+key
          ? relForm(key,un,'ag')
          : `<button type="button" class="ghost sm relb" data-arm="rp:${key}">Release unused to ${sn(d)}</button>`}</span>`; })()}</div>`;
  }).join('');
  const visible = q => q!==p && lci(b,q)<=myL;
  const sources = origins(b).filter(u=>u!==p && vany(poolFrom(b,u)) && lci(b,u)<=myL);
  const myBk = S.bookings.filter(x=>x.b===b&&x.port===p);
  const podOpts = podsFor(b,p).map(d=>`<option value="${d}">${nm(d)}</option>`).join('');
  const un=vpos(vsub(effP(b,p),usedP(b,p)));
  const ra=rfA(b,p), rfHeld=ra!==undefined?Math.max(0,ra-rfUsed(b,p)):0;
  return `<div class="grid">${alerts()}${reminder()}
    <section class="panel" data-nav="My allocation"><div class="ph"><div>
      <div class="eyebrow">${BD(b).label} · ${fi?`Loading via ${sn(fi.hub)} · ${fi.svc?fi.svc+' service':fi.land}`:'Vessel call'} · cut-off ${cutoff(E(myL))}</div>
      <h2>${nm(p)} <code class="muted">${p}</code> allocation</h2></div>
      <div>${closed?'<span class="chip closed">Released. Booking closed.</span>': armed===p
        ? `<div class="acts">${reasonSel('rs-port-'+p,'release')}<button type="button" class="danger armed" data-release="${p}">Release ${n0(un.teu)} TEU / ${n0(un.mt)} MT${rfHeld?` / ${rfHeld} plugs`:''} and close</button><button type="button" class="ghost" data-disarm>Cancel</button></div>`
        : `<button type="button" class="danger" data-arm="${p}" ${vany(un)||rfHeld?'':'disabled'}>Release unused balance</button>`}</div></div>
      <div class="mine">${cards||'<p class="empty">HQ has not released allocation to this port yet.</p>'}${rfCard(b,p)}</div>
    </section>

    ${forecastPanel(b,p)}
    <section class="panel two3" data-nav="Book cargo"><div class="ph"><div><h2>Book cargo</h2><p>Final destination decides the handling: same as the port of discharge is direct, anything else is transhipped there. TEU, tonnage and reefer plugs must all fit.</p></div></div>
      <form class="form" id="f-book">
        <div class="field"><label for="bk-ref">Booking ref</label><input id="bk-ref" type="text" value="${p.slice(2)}${b==='WB'?'W':'E'}${Math.floor(Math.random()*9000)+1000}" style="width:9em"></div>
        <div class="field"><label for="bk-pod">Port of discharge</label><select id="bk-pod">${podOpts}</select></div>
        <div class="field"><label for="bk-fpd">Final destination</label><select id="bk-fpd"></select></div>
        <div class="field"><label for="bk-cust">Customer</label><select id="bk-cust"><option value="">Spot / other</option>${[...new Set(contractsOf(b,p).map(c=>c.customer))].map(cu=>`<option value="${esc(cu)}">${esc(cu)} (protected ${contractsOf(b,p).filter(c=>c.customer===cu).map(c=>sn(c.pod)).join(', ')})</option>`).join('')}</select></div>
        <div class="field"><label for="bk-e20">20'</label><input id="bk-e20" type="number" min="0" step="1" value="2"></div>
        <div class="field"><label for="bk-e40">40'</label><input id="bk-e40" type="number" min="0" step="1" value="1"></div>
        <div class="field"><label for="bk-ehc">40'HC</label><input id="bk-ehc" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label for="bk-teu">TEU</label><input id="bk-teu" class="ro" type="number" value="4" readonly tabindex="-1" title="Worked out from the boxes, plus slots lost to out-of-gauge"></div>
        <div class="field"><label for="bk-mt">Gross weight (MT)</label><input id="bk-mt" class="mt" type="number" min="0" step="1" value="${4*BD(b).mtPerTeu}"></div>
        <div class="field rfx"><label for="bk-rf">Reefer units</label><input id="bk-rf" type="number" min="0" step="1" value="0"></div>
        <div class="field rfx"><label for="bk-rfteu">Reefer TEU</label><input id="bk-rfteu" type="number" min="0" step="1" value="0"></div>
        <div class="field spx"><label for="bk-dg">DG units</label><input id="bk-dg" type="number" min="0" step="1" value="0"></div>
        <div class="field spx"><label for="bk-dgc">IMO class</label><select id="bk-dgc">${DG_CLASSES.map(c=>`<option value="${c}" ${c===3?'selected':''}>Class ${c}</option>`).join('')}</select></div>
        <div class="field spx"><label for="bk-oog">OOG units</label><input id="bk-oog" type="number" min="0" step="1" value="0"></div>
        <div class="field spx"><label for="bk-lost">TEU lost per OOG</label><input id="bk-lost" type="number" min="0" step="1" value="2"></div>
        <button class="primary" type="submit" ${closed?'disabled':''}>Add booking</button>
      </form>
      <p class="hint" id="bk-hint"></p>
      ${contractsOf(b,p).length?`<p class="note">Space protected at ${nm(p)}: ${contractsOf(b,p).map(c=>{ const u=ctUsed(c); return `<b>${esc(c.customer)}</b> → ${sn(c.pod)} ${n0(u.teu)} of ${n0(c.teu)} TEU`; }).join(' · ')}. Spot bookings to those ports cannot use the unfilled part (${tot(ctUnfilled(b,p))}).</p>`:''}
      ${myBk.length?`<div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>POD</th><th>Final destination</th><th>Handling</th><th class="num">TEU<small>boxes</small></th><th class="num">MT</th><th class="num">RF</th><th>Special</th><th></th></tr></thead><tbody>${
        myBk.slice().reverse().map(x=>`<tr><td class="mono">${esc(x.ref)}${x.customer?`<br><small class="muted">${esc(x.customer)}</small>`:''}</td><td>${sn(x.pod)}</td><td>${nm(x.fpd)}</td><td>${handling(b,x.pod,x.fpd)}</td><td class="num">${n0(x.teu)}<br><small class="muted">${eqLabel(x)}</small></td><td class="num wt">${n0(x.mt)}</td><td class="num rft">${x.rf?`${x.rf} <small>(${x.rfTeu} TEU)</small>`:'<span class="muted">—</span>'}</td><td>${spChips(x)||'<span class="muted">—</span>'}</td><td>${closed?'':`<button type="button" class="ghost" data-del="${x.id}" aria-label="Remove booking ${esc(x.ref)}">Remove</button>`}</td></tr>`).join('')
      }</tbody></table></div>`:'<p class="empty">No bookings yet. Add the first one above.</p>'}
      ${myRequests(b,p)}
    </section>

    <section class="panel third" data-nav="Balance you can use"><div class="ph"><div><h2>Balance you can use</h2><p>Released by ports loading before you or at your call.</p></div></div>
      ${sources.length? sources.map(u=>{const av=poolFrom(b,u); return `<div class="pool-row"><div class="what"><b>${n0(av.teu)} TEU · ${n0(av.mt)} MT</b> from ${nm(u)}<br><span class="muted" style="font-size:.8rem">Released at cut-off ${cutoff(E(lci(b,u)))}</span></div>
        <div class="form"><div class="field"><label for="pl-teu-${u}">TEU</label><input id="pl-teu-${u}" type="number" min="0" value="${Math.min(10,av.teu)}"></div>
        <div class="field"><label for="pl-mt-${u}">MT</label><input id="pl-mt-${u}" class="mt" type="number" min="0" value="${Math.min(10*BD(b).mtPerTeu,av.mt)}"></div>
        <div class="field"><label for="pl-pod-${u}">For</label><select id="pl-pod-${u}">${podOpts}</select></div>
        <button type="button" class="primary" data-take="${u}" ${closed?'disabled':''}>Take</button></div></div>`}).join('')
      : '<p class="empty">Nothing released ahead of you yet. Unbooked balance at the ports below comes to the pool when they release it.</p>'}
    </section>

    <section class="panel" data-nav="Ports ahead of you"><div class="ph"><div><h2>Ports loading ahead of you</h2>
      <p>Read-only. Unbooked balance at an open port is not yours yet. It moves to the pool when that port releases it or HQ releases it at cut-off.</p></div></div>
      ${origins(b).some(visible) ? board(b,visible,{editable:false, actions:false}) : '<p class="empty">You are the first loading call on this bound.</p>'}
    </section>
    ${dischargePlan(b,myBk,'Your cargo by discharge port','Direct discharge versus transhipment for your bookings.')}
    ${isPod(b,p)?dischargePlan(b,S.bookings.filter(x=>x.b===b),'Discharging at '+sn(p),'Cargo other ports have booked to your port on this bound.',p):''}
    ${iaWeekPanel()}
    ${pipelinePanel()}
  </div>`;
